<svg xmlns="http://www.w3.org/2000/svg" width="774" height="564" viewBox="0 0 774 564"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#adb5bd"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#adb5bd"/></marker><marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="as1" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">OAuth 2.0 Authorization Code + PKCE (OIDC login)</tspan></text><rect x="20" y="60" width="140" height="55" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="90" y="83">User /</tspan><tspan x="90" y="102">Browser</tspan></text><path d="M90,115 L90,540" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)"/><rect x="210" y="60" width="140" height="55" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="280" y="92">Client app</tspan></text><path d="M280,115 L280,540" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)"/><rect x="410" y="60" width="140" height="55" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="480" y="83">Auth server</tspan><tspan x="480" y="102">(IdP)</tspan></text><path d="M480,115 L480,540" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)"/><rect x="610" y="60" width="140" height="55" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="680" y="92">Resource API</tspan></text><path d="M680,115 L680,540" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)"/><path d="M90,150 L280,150" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="115.47999999999999" y="139.875" width="139.04000000000002" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="185" y="154">1. click &#x27;Sign in&#x27;</tspan></text><path d="M280,195 L480,195" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="295.91999999999996" y="176.75" width="168.16000000000003" height="36.5" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="380" y="191">2. redirect /authorize</tspan><tspan x="380" y="207">   + code_challenge</tspan></text><path d="M90,250 L480,250" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="186.35999999999999" y="239.875" width="197.28000000000003" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="285" y="254">3. user logs in + consents</tspan></text><path d="M480,300 L280,300" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><rect x="281.36" y="289.875" width="197.28000000000003" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="380" y="304">4. redirect back ?code=xyz</tspan></text><path d="M280,355 L480,355" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="299.56" y="336.75" width="160.88000000000002" height="36.5" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="380" y="351">5. POST /token code +</tspan><tspan x="380" y="367">   code_verifier</tspan></text><path d="M480,410 L280,410" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><rect x="306.84" y="391.75" width="146.32000000000002" height="36.5" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="380" y="406">6. access + refresh</tspan><tspan x="380" y="422">   (+ ID token)</tspan></text><path d="M280,470 L680,470" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="381.36" y="459.875" width="197.28000000000003" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="480" y="474">7. GET /api  Bearer access</tspan></text><path d="M680,520 L280,520" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><rect x="450.52" y="509.875" width="58.96000000000001" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="480" y="524">8. data</tspan></text></svg>