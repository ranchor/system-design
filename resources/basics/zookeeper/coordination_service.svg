<svg xmlns="http://www.w3.org/2000/svg" width="955" height="384" viewBox="0 0 955 384"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">Coordination service: leader election with ephemeral sequential nodes</tspan></text><rect x="20" y="60" width="360" height="300" rx="12" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6741d9" font-weight="bold"><tspan x="30" y="80">etcd / ZooKeeper ensemble (Raft / ZAB)</tspan></text><rect x="150" y="100" width="110" height="50" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="205" y="130">Leader</tspan></text><rect x="50" y="230" width="110" height="50" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="105" y="260">Follower</tspan></text><rect x="250" y="230" width="110" height="50" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="305" y="260">Follower</tspan></text><path d="M180,150 L120,230" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="115.75999999999999" y="180.5" width="68.48" height="19.0" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#343a40" text-anchor="middle"><tspan x="150" y="194">replicate</tspan></text><path d="M230,150 L290,230" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="40" y="312">majority ack -&gt; committed (linearizable)</tspan></text><rect x="400" y="60" width="430" height="300" rx="12" fill="#fff9db" stroke="#f08c00" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#f08c00" font-weight="bold"><tspan x="410" y="80">/election (znodes)</tspan></text><rect x="420" y="105" width="170" height="50" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="505" y="134">n_0001  (ephemeral)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#343a40"><tspan x="610" y="133">Scheduler A  = LEADER</tspan></text><rect x="420" y="180" width="170" height="50" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="505" y="209">n_0002</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#343a40"><tspan x="610" y="208">Scheduler B  watches n_0001</tspan></text><rect x="420" y="255" width="170" height="50" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="505" y="284">n_0003</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#343a40"><tspan x="610" y="283">Scheduler C  watches n_0002</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c92a2a"><tspan x="420" y="342">A&#x27;s session dies -&gt; n_0001 deleted -&gt; B is lowest -&gt; B leads</tspan></text><path d="M380,200 L420,200" fill="none" stroke="#1e1e1e" stroke-width="2