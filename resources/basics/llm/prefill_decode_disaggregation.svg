<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Prefill/decode: colocated vs disaggregated serving</tspan></text><rect x="20" y="56" width="920" height="200" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="920" height="28" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">A. Colocated (one pool): prefill and decode share every GPU</tspan></text><rect x="40" y="104" width="150" height="44" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="115.0" y="122.675" xml:space="preserve">Requests</tspan><tspan x="115.0" y="136.675" xml:space="preserve">(prompt + generate)</tspan></text><path d="M192,126 L252,126" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="254" y="98" width="420" height="140" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="264" y="116" xml:space="preserve">GPU (continuous batching)</tspan></text><rect x="268" y="126" width="120" height="34" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="328.0" y="146.675" xml:space="preserve">decode step A</tspan></text><rect x="396" y="126" width="130" height="34" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="461.0" y="146.675" xml:space="preserve">PREFILL (long)</tspan></text><rect x="534" y="126" width="120" height="34" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="594.0" y="146.675" xml:space="preserve">decode step A</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="268" y="184" xml:space="preserve">Decode steps are stalled behind the long prefill → TPOT spikes (jitter).</tspan><tspan x="268" y="199" xml:space="preserve">Both phases fight for one parallelism/batch config and one GPU type.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#e03131" font-weight="bold"><tspan x="268" y="222" xml:space="preserve">Compute-bound prefill + memory-bound decode interfere</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="700" y="118" xml:space="preserve">Pros</tspan><tspan x="700" y="133" xml:space="preserve">• simple, no KV transfer</tspan><tspan x="700" y="148" xml:space="preserve">• best for short prompts,</tspan><tspan x="700" y="163" xml:space="preserve">  light load, small models</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="700" y="190" xml:space="preserve">Cons</tspan><tspan x="700" y="205" xml:space="preserve">• TTFT/TPOT coupled</tspan><tspan x="700" y="220" xml:space="preserve">• over-provision for SLOs</tspan></text><rect x="20" y="276" width="920" height="270" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="276" width="920" height="28" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="296" xml:space="preserve">B. Disaggregated: separate pools, KV cache handed off over the network</tspan></text><rect x="40" y="330" width="120" height="50" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="100.0" y="351.35" xml:space="preserve">Router /</tspan><tspan x="100.0" y="366.35" xml:space="preserve">scheduler</tspan></text><rect x="200" y="326" width="230" height="64" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="315.0" y="347.675" xml:space="preserve">PREFILL pool</tspan><tspan x="315.0" y="361.675" xml:space="preserve">compute-bound · TP-heavy</tspan><tspan x="315.0" y="375.675" xml:space="preserve">batch by tokens → low TTFT</tspan></text><rect x="570" y="326" width="230" height="64" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="685.0" y="347.675" xml:space="preserve">DECODE pool</tspan><tspan x="685.0" y="361.675" xml:space="preserve">memory-bandwidth-bound</tspan><tspan x="685.0" y="375.675" xml:space="preserve">large batches, KV in HBM → low TPOT</tspan></text><path d="M162,350 L198,350" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M432,358 L568,358" fill="none" stroke="#6741d9" stroke-width="3" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#6741d9" font-weight="bold" text-anchor="middle"><tspan x="500" y="346" xml:space="preserve">KV cache transfer</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="500" y="376" xml:space="preserve">NVLink / RDMA / GPUDirect</tspan></text><path d="M802,358 L862,358" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="864" y="334" width="76" height="48" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="902.0" y="354.675" xml:space="preserve">stream</tspan><tspan x="902.0" y="368.675" xml:space="preserve">tokens</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="40" y="420" xml:space="preserve">Request flow: route → prefill builds the KV cache and emits token #1 (TTFT) → KV blocks move to a decode GPU → decode generates tokens (TPOT) until EOS.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="40" y="450" xml:space="preserve">Wins</tspan><tspan x="40" y="466" xml:space="preserve">• tune each phase separately: different TP/PP, batch size, even GPU type</tspan><tspan x="40" y="482" xml:space="preserve">• no prefill stalls inside decode → steadier TPOT; scale pools independently</tspan><tspan x="40" y="498" xml:space="preserve">• higher goodput (requests meeting both TTFT and TPOT SLOs) per GPU</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="500" y="450" xml:space="preserve">Costs</tspan><tspan x="500" y="466" xml:space="preserve">• KV transfer latency &amp; bandwidth (must beat the saved interference)</tspan><tspan x="500" y="482" xml:space="preserve">• routing, pool sizing, and two failure domains to operate</tspan><tspan x="500" y="498" xml:space="preserve">• lose on short prompts / low load; needs fast interconnect</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" font-style="italic"><tspan x="40" y="520" xml:space="preserve">Metrics: TTFT = time to first token (prefill) · TPOT/ITL = time per output token (decode) · goodput = req/s within SLO</tspan></text></svg>