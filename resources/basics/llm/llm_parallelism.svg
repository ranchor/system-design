<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Model parallelism: how a model is split across GPUs</tspan></text><rect x="16" y="56" width="176" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="16" y="56" width="176" height="30" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="104" y="76" xml:space="preserve">Data parallel (DP)</tspan></text><rect x="30" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="53.0" y="122.5" xml:space="preserve">GPU0</tspan></text><rect x="82" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="105.0" y="122.5" xml:space="preserve">GPU1</tspan></text><rect x="134" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="157.0" y="122.5" xml:space="preserve">GPU2</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="26" y="166" xml:space="preserve">Full model copy per GPU,</tspan><tspan x="26" y="181" xml:space="preserve">different requests / batches.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="26" y="216" xml:space="preserve">Good for</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="26" y="232" xml:space="preserve">Scales throughput. No help</tspan><tspan x="26" y="246" xml:space="preserve">if the model doesn't fit one</tspan><tspan x="26" y="260" xml:space="preserve">GPU.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="26" y="290" xml:space="preserve">Communication</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="26" y="306" xml:space="preserve">comm: none (inference) /</tspan><tspan x="26" y="320" xml:space="preserve">grad all-reduce (training)</tspan></text><rect x="204" y="56" width="176" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="204" y="56" width="176" height="30" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="292" y="76" xml:space="preserve">Tensor parallel (TP)</tspan></text><rect x="218" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="241.0" y="122.5" xml:space="preserve">GPU0</tspan></text><rect x="270" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="293.0" y="122.5" xml:space="preserve">GPU1</tspan></text><rect x="322" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="345.0" y="122.5" xml:space="preserve">GPU2</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="214" y="166" xml:space="preserve">Split each layer's matrices</tspan><tspan x="214" y="181" xml:space="preserve">across GPUs (columns/rows).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="214" y="216" xml:space="preserve">Good for</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="214" y="232" xml:space="preserve">Cuts latency &amp; per-GPU</tspan><tspan x="214" y="246" xml:space="preserve">memory. Needs NVLink.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="214" y="290" xml:space="preserve">Communication</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="214" y="306" xml:space="preserve">comm: all-reduce twice per</tspan><tspan x="214" y="320" xml:space="preserve">layer</tspan></text><rect x="392" y="56" width="176" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="392" y="56" width="176" height="30" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="480" y="76" xml:space="preserve">Pipeline parallel (PP)</tspan></text><rect x="406" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="429.0" y="122.5" xml:space="preserve">GPU0</tspan></text><rect x="458" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="481.0" y="122.5" xml:space="preserve">GPU1</tspan></text><rect x="510" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="533.0" y="122.5" xml:space="preserve">GPU2</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="402" y="166" xml:space="preserve">Split layers into stages;</tspan><tspan x="402" y="181" xml:space="preserve">micro-batches flow through.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="402" y="216" xml:space="preserve">Good for</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="402" y="232" xml:space="preserve">Fits huge models across</tspan><tspan x="402" y="246" xml:space="preserve">nodes. Bubbles hurt latency.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="402" y="290" xml:space="preserve">Communication</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="402" y="306" xml:space="preserve">comm: activations between</tspan><tspan x="402" y="320" xml:space="preserve">stages</tspan></text><rect x="580" y="56" width="176" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="580" y="56" width="176" height="30" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="668" y="76" xml:space="preserve">Expert parallel (EP)</tspan></text><rect x="594" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="617.0" y="122.5" xml:space="preserve">GPU0</tspan></text><rect x="646" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="669.0" y="122.5" xml:space="preserve">GPU1</tspan></text><rect x="698" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="721.0" y="122.5" xml:space="preserve">GPU2</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="590" y="166" xml:space="preserve">MoE: experts live on different</tspan><tspan x="590" y="181" xml:space="preserve">GPUs; tokens routed to them.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="590" y="216" xml:space="preserve">Good for</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="590" y="232" xml:space="preserve">Scales MoE capacity. Load</tspan><tspan x="590" y="246" xml:space="preserve">imbalance risk.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="590" y="290" xml:space="preserve">Communication</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="590" y="306" xml:space="preserve">comm: all-to-all</tspan><tspan x="590" y="320" xml:space="preserve">dispatch/combine</tspan></text><rect x="768" y="56" width="176" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="768" y="56" width="176" height="30" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="856" y="76" xml:space="preserve">Context / sequence (CP)</tspan></text><rect x="782" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="805.0" y="122.5" xml:space="preserve">GPU0</tspan></text><rect x="834" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="857.0" y="122.5" xml:space="preserve">GPU1</tspan></text><rect x="886" y="100" width="46" height="38" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="909.0" y="122.5" xml:space="preserve">GPU2</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="778" y="166" xml:space="preserve">Split a long sequence across</tspan><tspan x="778" y="181" xml:space="preserve">GPUs (ring attention).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="778" y="216" xml:space="preserve">Good for</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="778" y="232" xml:space="preserve">Very long prompts/contexts.</tspan><tspan x="778" y="246" xml:space="preserve">Extra KV exchange.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="778" y="290" xml:space="preserve">Communication</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="778" y="306" xml:space="preserve">comm: ring KV passing</tspan></text><rect x="16" y="372" width="928" height="84" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="28" y="394" xml:space="preserve">Rules of thumb</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="28" y="413" xml:space="preserve">• Keep TP inside one NVLink node; use PP/EP across nodes. • Combine them: e.g. TP8 × PP2 × DP4, with EP for MoE layers.</tspan><tspan x="28" y="429" xml:space="preserve">• Inference prefers fewer, larger-batch decode replicas; training adds optimizer-state sharding (ZeRO/FSDP) on top of DP.</tspan><tspan x="28" y="445" xml:space="preserve">• More parallelism = less memory/latency per GPU but more communication; pick the minimum that fits and meets the SLO.</tspan></text></svg>