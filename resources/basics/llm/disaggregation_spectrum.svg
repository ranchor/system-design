<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Disaggregation spectrum: split what scales differently</tspan></text><rect x="20" y="60" width="176" height="40" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="108.0" y="83.85" xml:space="preserve">0. Monolithic replica</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="108" y="126" xml:space="preserve">one process: tokenize, prefill,</tspan><tspan x="108" y="141" xml:space="preserve">decode, sample on the same GPUs</tspan></text><rect x="208" y="60" width="176" height="40" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="296.0" y="83.85" xml:space="preserve">1. Prefill | Decode</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="296" y="126" xml:space="preserve">separate pools; KV cache transferred</tspan><tspan x="296" y="141" xml:space="preserve">(DistServe, Splitwise, Dynamo, llm-d)</tspan></text><path d="M198,80 L208,80" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="396" y="60" width="176" height="40" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="484.0" y="83.85" xml:space="preserve">2. + Encode (multimodal)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="484" y="126" xml:space="preserve">vision/audio encoder pool → prefill</tspan><tspan x="484" y="141" xml:space="preserve">→ decode (E/P/D)</tspan></text><path d="M386,80 L396,80" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="584" y="60" width="176" height="40" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="672.0" y="83.85" xml:space="preserve">3. + KV cache tier</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="672" y="126" xml:space="preserve">KV offloaded to CPU/SSD/remote</tspan><tspan x="672" y="141" xml:space="preserve">shared cache pool (Mooncake, LMCache)</tspan></text><path d="M574,80 L584,80" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="772" y="60" width="176" height="40" rx="8" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="860.0" y="83.85" xml:space="preserve">4. Attention | FFN (research)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="860" y="126" xml:space="preserve">split attention (memory-bound) from</tspan><tspan x="860" y="141" xml:space="preserve">FFN/MoE experts (compute-bound)</tspan></text><path d="M762,80 L772,80" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="190" width="920" height="190" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal"><tspan x="34" y="214" xml:space="preserve">Same idea as classic compute/storage separation in databases: put each resource profile in its own pool, scale it independently,</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal"><tspan x="34" y="232" xml:space="preserve">and pay a network hop for the flexibility.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="34" y="266" xml:space="preserve">Split when…</tspan><tspan x="34" y="283" xml:space="preserve">• phases have very different bottlenecks (compute vs memory bandwidth vs capacity)</tspan><tspan x="34" y="300" xml:space="preserve">• SLOs conflict (TTFT vs TPOT) and interference hurts tail latency</tspan><tspan x="34" y="317" xml:space="preserve">• you need different hardware/parallelism per stage, or independent autoscaling</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="500" y="266" xml:space="preserve">Don't split when…</tspan><tspan x="500" y="283" xml:space="preserve">• the handoff (KV transfer, routing, extra hop) costs more than the interference it removes</tspan><tspan x="500" y="300" xml:space="preserve">• load is light, prompts are short, or the model is small</tspan><tspan x="500" y="317" xml:space="preserve">• you lack RDMA/NVLink-class interconnect or the ops maturity</tspan></text></svg>