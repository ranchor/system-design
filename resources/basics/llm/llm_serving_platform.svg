<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">LLM serving platform: gateway → router → engine pools</tspan></text><rect x="20" y="200" width="110" height="60" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="75.0" y="226.35" xml:space="preserve">Clients</tspan><tspan x="75.0" y="241.35" xml:space="preserve">apps, agents</tspan></text><path d="M132,230 L170,230" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="172" y="60" width="300" height="340" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="172" y="60" width="300" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="184" y="80" xml:space="preserve">LLM gateway (control/data plane)</tspan></text><rect x="188" y="100" width="268" height="38" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="322.0" y="122.675" xml:space="preserve">AuthN/Z, tenant &amp; API keys</tspan></text><rect x="188" y="149" width="268" height="38" rx="8" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="322.0" y="171.675" xml:space="preserve">Token-based rate limits &amp; quotas</tspan></text><rect x="188" y="198" width="268" height="38" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="322.0" y="220.675" xml:space="preserve">Request validation, PII / safety filters</tspan></text><rect x="188" y="247" width="268" height="38" rx="8" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="322.0" y="269.675" xml:space="preserve">Semantic / exact response cache</tspan></text><rect x="188" y="296" width="268" height="38" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="322.0" y="318.675" xml:space="preserve">Model routing, fallbacks, retries</tspan></text><rect x="188" y="345" width="268" height="38" rx="8" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="322.0" y="367.675" xml:space="preserve">Streaming (SSE) &amp; usage metering</tspan></text><path d="M474,230 L520,230" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="522" y="190" width="140" height="80" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="592.0" y="219.675" xml:space="preserve">Inference router</tspan><tspan x="592.0" y="233.675" xml:space="preserve">queue-, prefix-, SLO-</tspan><tspan x="592.0" y="247.675" xml:space="preserve">aware scheduling</tspan></text><path d="M664,215 L712,130" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M664,230 L712,230" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M664,245 L712,330" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="714" y="80" width="226" height="100" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="827.0" y="119.675" xml:space="preserve">Prefill pool</tspan><tspan x="827.0" y="133.675" xml:space="preserve">compute-bound GPUs</tspan><tspan x="827.0" y="147.675" xml:space="preserve">prefix cache, chunked prefill</tspan></text><rect x="714" y="190" width="226" height="80" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="827.0" y="226.675" xml:space="preserve">Decode pool</tspan><tspan x="827.0" y="240.675" xml:space="preserve">big batches, KV in HBM</tspan></text><rect x="714" y="290" width="226" height="90" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="827.0" y="324.675" xml:space="preserve">Other models / replicas</tspan><tspan x="827.0" y="338.675" xml:space="preserve">small, large, fine-tuned (LoRA),</tspan><tspan x="827.0" y="352.675" xml:space="preserve">embedding, reranker</tspan></text><path d="M826,182 L826,188" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)" marker-start="url(#as)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="424" xml:space="preserve">Cross-cutting: GPU autoscaling on queue delay / SLO attainment (not CPU%) · warm pools for slow model loads · multi-AZ + fallback model/provider · per-request tracing with TTFT, TPOT, tokens, cost.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="444" xml:space="preserve">Control signals: KV-cache occupancy, queue depth, cache-hit rate, GPU util / memory bandwidth, error and timeout rates.</tspan></text></svg>