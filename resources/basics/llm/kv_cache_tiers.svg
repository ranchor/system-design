<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">KV cache hierarchy: reuse beats recompute</tspan></text><rect x="20" y="60" width="214" height="64" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="127.0" y="80.85" xml:space="preserve">GPU HBM</tspan><tspan x="127.0" y="95.85" xml:space="preserve">fastest, smallest</tspan><tspan x="127.0" y="110.85" xml:space="preserve">~10s-100s GB</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="127" y="146" xml:space="preserve">active sequences + hottest prefixes</tspan></text><rect x="252" y="60" width="214" height="64" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="359.0" y="80.85" xml:space="preserve">CPU DRAM</tspan><tspan x="359.0" y="95.85" xml:space="preserve">~10-100x larger</tspan><tspan x="359.0" y="110.85" xml:space="preserve">PCIe/NVLink-C2C</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="359" y="146" xml:space="preserve">warm prefixes, preempted sequences</tspan></text><path d="M236,92 L250,92" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)" marker-start="url(#as)"/><rect x="484" y="60" width="214" height="64" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="591.0" y="88.35" xml:space="preserve">Local SSD</tspan><tspan x="591.0" y="103.35" xml:space="preserve">TBs, higher latency</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="591" y="146" xml:space="preserve">cold prefixes, long-lived sessions</tspan></text><path d="M468,92 L482,92" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)" marker-start="url(#as)"/><rect x="716" y="60" width="214" height="64" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="823.0" y="80.85" xml:space="preserve">Remote cache pool</tspan><tspan x="823.0" y="95.85" xml:space="preserve">shared across replicas</tspan><tspan x="823.0" y="110.85" xml:space="preserve">via RDMA / object store</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="823" y="146" xml:space="preserve">fleet-wide prefix reuse (Mooncake, LMCache)</tspan></text><path d="M700,92 L714,92" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)" marker-start="url(#as)"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="190" xml:space="preserve">Lookup path for a new request</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="20" y="210" xml:space="preserve">1. Hash the prompt in blocks (e.g. 16-token pages) or walk a radix tree → find the longest cached prefix, locally or on another node.</tspan><tspan x="20" y="228" xml:space="preserve">2. Hit → load those KV blocks (tier-to-GPU copy or RDMA) and prefill only the remaining suffix. Miss → full prefill.</tspan><tspan x="20" y="246" xml:space="preserve">3. New blocks are written to HBM; under pressure, evict (LRU/LFU, ref-count aware) or demote to a lower tier instead of dropping.</tspan></text><rect x="20" y="282" width="920" height="100" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="304" xml:space="preserve">When it pays off</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="34" y="322" xml:space="preserve">• Shared system prompts, few-shot examples, RAG templates, agent loops, multi-turn chat (the prefix repeats).</tspan><tspan x="34" y="338" xml:space="preserve">• Reload time (bytes ÷ bandwidth) must be less than recompute time; short prefixes aren't worth a remote fetch.</tspan><tspan x="34" y="354" xml:space="preserve">• Cache-aware routing sends a request to the replica already holding its prefix; this competes with load balancing.</tspan></text></svg>