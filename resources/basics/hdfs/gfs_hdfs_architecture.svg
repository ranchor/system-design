<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">GFS / HDFS: one metadata master, many chunk/data servers, big blocks</tspan></text><rect x="20" y="150" width="100" height="44" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="70.0" y="175.85" xml:space="preserve">Client</tspan></text><rect x="200" y="60" width="240" height="110" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="212" y="82" xml:space="preserve">NameNode / GFS master</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="212" y="104" xml:space="preserve">namespace, file → block list,</tspan><tspan x="212" y="119" xml:space="preserve">block → locations (in RAM),</tspan><tspan x="212" y="134" xml:space="preserve">edit log + checkpoint, standby (HA)</tspan></text><rect x="200" y="0" width="0" height="0" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="200" y="0" width="0" height="0" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="200" y="0" width="0" height="0" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="200" y="0" width="0" height="0" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="190" y="250" width="105" height="60" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="242.5" y="276.675" xml:space="preserve">DN1</tspan><tspan x="242.5" y="290.675" xml:space="preserve">B1 B3</tspan></text><path d="M320,172 L242,248" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="305" y="250" width="105" height="60" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="357.5" y="276.675" xml:space="preserve">DN2</tspan><tspan x="357.5" y="290.675" xml:space="preserve">B1 B2</tspan></text><path d="M320,172 L357,248" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="420" y="250" width="105" height="60" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="472.5" y="276.675" xml:space="preserve">DN3</tspan><tspan x="472.5" y="290.675" xml:space="preserve">B2 B3</tspan></text><path d="M320,172 L472,248" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="535" y="250" width="105" height="60" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="587.5" y="276.675" xml:space="preserve">DN4</tspan><tspan x="587.5" y="290.675" xml:space="preserve">B1 B2 B3</tspan></text><path d="M320,172 L587,248" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/><path d="M122,160 L198,120" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="130" y="126" xml:space="preserve">1 metadata</tspan></text><path d="M122,185 L190,258" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="100" y="236" xml:space="preserve">2 data direct</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="660" y="70" xml:space="preserve">Block 128 MB (HDFS) / 64 MB (GFS)</tspan><tspan x="660" y="92" xml:space="preserve">Replication factor 3, rack-aware</tspan><tspan x="660" y="114" xml:space="preserve">DataNodes heartbeat + block reports</tspan><tspan x="660" y="136" xml:space="preserve">Re-replicate when a node dies</tspan><tspan x="660" y="158" xml:space="preserve">Write pipeline: client → DN1 → DN2 → DN3</tspan><tspan x="660" y="180" xml:space="preserve">Append-mostly, large sequential I/O</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="350" xml:space="preserve">Master is off the data path (metadata only) so it doesn't bottleneck; a single namenode's RAM limits file count (federation fixes that).</tspan></text></svg>