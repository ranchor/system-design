<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">What goes wrong after you shard, and what to do about it</tspan></text><rect x="20" y="56" width="440" height="330" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="440" height="28" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">Hot spot: a celebrity key overloads one shard</tspan></text><rect x="40" y="110" width="90" height="36" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="85.0" y="131.85" xml:space="preserve">servers</tspan></text><rect x="260" y="100" width="170" height="38" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="345.0" y="122.675" xml:space="preserve">Shard 1: celebrity</tspan></text><path d="M132,128 L258,119" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="190" y="112" xml:space="preserve">1M rps</tspan></text><rect x="260" y="150" width="170" height="38" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="345.0" y="172.675" xml:space="preserve">Shard 2</tspan></text><path d="M132,128 L258,169" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="190" y="150" xml:space="preserve">1k rps</tspan></text><rect x="260" y="200" width="170" height="38" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="345.0" y="222.675" xml:space="preserve">Shard 3</tspan></text><path d="M132,128 L258,219" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="190" y="188" xml:space="preserve">1k rps</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="262" xml:space="preserve">Fixes (pick by cause):</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="282" xml:space="preserve">• Isolate hot keys on a dedicated shard (directory)</tspan><tspan x="32" y="298" xml:space="preserve">• Compound key: hash(user_id, day) spreads one key in time</tspan><tspan x="32" y="314" xml:space="preserve">• Replicate hot reads / cache in front; in-process L1</tspan><tspan x="32" y="330" xml:space="preserve">• Salting: key#0..N for hot counters, sum on read</tspan><tspan x="32" y="346" xml:space="preserve">• Auto split + move (MongoDB balancer; Vitess is</tspan><tspan x="32" y="362" xml:space="preserve">   operator-driven resharding)</tspan><tspan x="32" y="378" xml:space="preserve">Time-based key (created_at): every write hits the newest shard.</tspan></text><rect x="480" y="56" width="440" height="330" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="480" y="56" width="440" height="28" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="492" y="76" xml:space="preserve">Cross-shard query: scatter-gather</tspan></text><rect x="500" y="160" width="90" height="40" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="545.0" y="176.675" xml:space="preserve">server</tspan><tspan x="545.0" y="190.675" xml:space="preserve">merge top 10</tspan></text><rect x="780" y="104" width="120" height="36" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="840.0" y="125.675" xml:space="preserve">Shard 1</tspan></text><path d="M592,180 L778,122" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)" marker-start="url(#as)"/><rect x="780" y="160" width="120" height="36" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="840.0" y="181.675" xml:space="preserve">Shard 2</tspan></text><path d="M592,180 L778,178" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)" marker-start="url(#as)"/><rect x="780" y="216" width="120" height="36" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="840.0" y="237.675" xml:space="preserve">Shard 3</tspan></text><path d="M592,180 L778,234" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)" marker-start="url(#as)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="500" y="290" xml:space="preserve">Latency = slowest of N shards; N× the calls.</tspan><tspan x="500" y="306" xml:space="preserve">Reduce them:</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="500" y="326" xml:space="preserve">• Shard by the key your hot queries filter on</tspan><tspan x="500" y="342" xml:space="preserve">• Cache or precompute global results (top-K, trending)</tspan><tspan x="500" y="358" xml:space="preserve">• Denormalize so one shard answers the query</tspan><tspan x="500" y="374" xml:space="preserve">• Single-shard transactions; sagas across shards,</tspan><tspan x="500" y="390" xml:space="preserve">   avoid 2PC; accept eventual consistency where OK</tspan></text></svg>