<svg xmlns="http://www.w3.org/2000/svg" width="940" height="470" viewBox="0 0 940 470"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Three ways to place a key on a shard</tspan></text><rect x="20" y="56" width="295" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="295" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="30" y="76" xml:space="preserve">Range</tspan></text><rect x="40" y="100" width="255" height="30" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="167.5" y="118.675" xml:space="preserve">shard 1: ids 1-1M</tspan></text><rect x="40" y="138" width="255" height="30" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="167.5" y="156.675" xml:space="preserve">shard 2: ids 1M-2M</tspan></text><rect x="40" y="176" width="255" height="30" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="167.5" y="194.675" xml:space="preserve">shard 3: ids 2M-3M</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="30" y="226" xml:space="preserve">Range scans stay on one shard. Hot-spots on</tspan><tspan x="30" y="241" xml:space="preserve">monotonic keys (created_at, auto-increment).</tspan><tspan x="30" y="256" xml:space="preserve">Good for multi-tenant ranges.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" font-style="italic"><tspan x="30" y="330" xml:space="preserve">e.g. HBase, Spanner, MongoDB ranged keys</tspan></text><rect x="325" y="56" width="295" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="325" y="56" width="295" height="28" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="335" y="76" xml:space="preserve">Hash (default)</tspan></text><rect x="345" y="100" width="255" height="30" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="472.5" y="118.675" xml:space="preserve">shard = hash(key) % N</tspan></text><rect x="345" y="138" width="255" height="30" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="472.5" y="156.675" xml:space="preserve">user 42 → shard 2</tspan></text><rect x="345" y="176" width="255" height="30" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="472.5" y="194.675" xml:space="preserve">user 99 → shard 3</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="335" y="226" xml:space="preserve">Even spread, no range scans. Plain % N</tspan><tspan x="335" y="241" xml:space="preserve">reshuffles almost everything when N changes:</tspan><tspan x="335" y="256" xml:space="preserve">use consistent hashing or many fixed virtual</tspan><tspan x="335" y="271" xml:space="preserve">shards.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" font-style="italic"><tspan x="335" y="330" xml:space="preserve">e.g. Cassandra, DynamoDB, Redis Cluster slots</tspan></text><rect x="630" y="56" width="295" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="630" y="56" width="295" height="28" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="640" y="76" xml:space="preserve">Directory / lookup</tspan></text><rect x="650" y="100" width="255" height="30" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="777.5" y="118.675" xml:space="preserve">user_to_shard table</tspan></text><rect x="650" y="138" width="255" height="30" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="777.5" y="156.675" xml:space="preserve">user 15 → shard 1</tspan></text><rect x="650" y="176" width="255" height="30" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="777.5" y="194.675" xml:space="preserve">user 87 → shard 4</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="640" y="226" xml:space="preserve">Most flexible (move a celebrity to a</tspan><tspan x="640" y="241" xml:space="preserve">dedicated shard). Extra hop on every</tspan><tspan x="640" y="256" xml:space="preserve">request; the directory is a critical</tspan><tspan x="640" y="271" xml:space="preserve">dependency, so cache it and replicate it.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" font-style="italic"><tspan x="640" y="330" xml:space="preserve">e.g. Large custom setups, some multi-tenant SaaS</tspan></text><rect x="20" y="372" width="900" height="84" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal"><tspan x="34" y="396" xml:space="preserve">Remap cost when going from 4 to 5 shards:  hash % N moves ~80% of keys;  consistent hashing moves ~1/5;  fixed virtual shards (e.g. 1024)</tspan><tspan x="34" y="415" xml:space="preserve">move whole virtual shards and never rehash;  range and directory move only the ranges / rows you choose.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="34" y="440" xml:space="preserve">Rule of thumb: hash on a high-cardinality key that appears in your hot queries; use range only when range scans matter.</tspan></text></svg>