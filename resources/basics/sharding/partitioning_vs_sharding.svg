<svg xmlns="http://www.w3.org/2000/svg" width="940" height="300" viewBox="0 0 940 300"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Partitioning vs sharding: same idea, different blast radius</tspan></text><rect x="20" y="56" width="440" height="230" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="440" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">Partitioning: split a table inside ONE database</tspan></text><rect x="40" y="104" width="400" height="34" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="240.0" y="124.85" xml:space="preserve">orders (500M rows, 2 TB) on one machine</tspan></text><rect x="40" y="156" width="125" height="34" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="102.5" y="176.675" xml:space="preserve">partition 2024</tspan></text><rect x="175" y="156" width="125" height="34" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="237.5" y="176.675" xml:space="preserve">partition 2025</tspan></text><rect x="310" y="156" width="125" height="34" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="372.5" y="176.675" xml:space="preserve">partition 2026 (hot)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="40" y="216" xml:space="preserve">Wins: query only scans the relevant partition, smaller</tspan><tspan x="40" y="231" xml:space="preserve">indexes, cheap retention (DROP PARTITION), faster vacuum.</tspan><tspan x="40" y="246" xml:space="preserve">Does NOT add CPU, RAM or disks: still one machine.</tspan></text><rect x="480" y="56" width="440" height="230" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="480" y="56" width="440" height="28" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="492" y="76" xml:space="preserve">Sharding: split data across MANY machines</tspan></text><rect x="500" y="104" width="130" height="34" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="565.0" y="124.85" xml:space="preserve">router / app</tspan></text><rect x="660" y="98" width="110" height="34" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="715.0" y="118.675" xml:space="preserve">Shard 1 (own DB)</tspan></text><path d="M632,121 L658,115" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="660" y="142" width="110" height="34" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="715.0" y="162.675" xml:space="preserve">Shard 2 (own DB)</tspan></text><path d="M632,121 L658,159" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="660" y="186" width="110" height="34" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="715.0" y="206.675" xml:space="preserve">Shard 3 (own DB)</tspan></text><path d="M632,121 L658,203" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="500" y="238" xml:space="preserve">Wins: storage, write and read throughput scale with</tspan><tspan x="500" y="253" xml:space="preserve">shards. Costs: routing, hot spots, cross-shard queries,</tspan><tspan x="500" y="268" xml:space="preserve">no single-DB transactions, resharding.</tspan></text></svg>