<svg xmlns="http://www.w3.org/2000/svg" width="940" height="500" viewBox="0 0 940 500"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Horizontal vs vertical partitioning (and where sharding fits)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="64" xml:space="preserve">Source: users(id, name, country, bio). One row = one user.</tspan></text><rect x="20" y="78" width="40" height="24" rx="3" fill="#e9ecef" stroke="#868e96" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="40.0" y="94" xml:space="preserve">id</tspan></text><rect x="20" y="102" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="124" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="146" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="168" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="60" y="78" width="70" height="24" rx="3" fill="#e9ecef" stroke="#868e96" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="95.0" y="94" xml:space="preserve">name</tspan></text><rect x="60" y="102" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="60" y="124" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5b