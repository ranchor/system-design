" y="150" xml:space="preserve">keep it identical in every partition.</tspan></text><rect x="20" y="214" width="440" height="270" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="214" width="440" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="234" xml:space="preserve">HORIZONTAL: split ROWS (same columns)</tspan></text><rect x="36" y="256" width="40" height="24" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="56.0" y="272" xml:space="preserve">id</tspan></text><rect x="36" y="280" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="36" y="302" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="76" y="256" width="70" height="24" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="111.0" y="272" xml:space="preserve">name</tspan></text><rect x="76" y="280" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="76" y="302" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="146" y="256" width="70" height="24" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="181.0" y="272" xml:space="preserve">country</tspan></text><rect x="146" y="280" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="146" y="302" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="216" y="256" width="80" height="24" rx="3" fill="#a5d8ff" stroke="#1971c2" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="256.0" y="272" xml:space="preserve">bio (big)</tspan></text><rect x="216" y="280" width="80" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="216" y="302" width="80" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="36" y="340" xml:space="preserve">partition A: ids 1 to 1M</tspan></text><rect x="36" y="354" width="40" height="24" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="56.0" y="370" xml:space="preserve">id</tspan></text><rect x="36" y="378" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="36" y="400" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="76" y="354" width="70" height="24" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="111.0" y="370" xml:space="preserve">name</tspan></text><rect x="76" y="378" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="76" y="400" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="146" y="354" width="70" height="24" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="181.0" y="370" xml:space="preserve">country</tspan></text><rect x="146" y="378" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="146" y="400" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="216" y="354" width="80" height="24" rx="3" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="256.0" y="370" xml:space="preserve">bio (big)</tspan></text><rect x="216" y="378" width="80" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="216" y="400" width="80" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="36" y="438" xml:space="preserve">partition B: ids 1M to 2M</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="300" y="276" xml:space="preserve">Within ONE database:</tspan><tspan x="300" y="292" xml:space="preserve">table partitioning</tspan><tspan x="300" y="308" xml:space="preserve">(pruning, cheap retention)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="300" y="350" xml:space="preserve">Across MANY machines:</tspan><tspan x="300" y="366" xml:space="preserve">SHARDING</tspan><tspan x="300" y="382" xml:space="preserve">(scales storage + writes)</tspan></text><rect x="480" y="214" width="440" height="270" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="480" y="214" width="440" height="28" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="492" y="234" xml:space="preserve">VERTICAL: split COLUMNS (same rows)</tspan></text><rect x="496" y="256" width="40" height="24" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="516.0" y="272" xml:space="preserve">id</tspan></text><rect x="496" y="280" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="496" y="302" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="536" y="256" width="70" height="24" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="571.0" y="272" xml:space="preserve">name</tspan></text><rect x="536" y="280" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="536" y="302" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="606" y="256" width="70" height="24" rx="3" fill="#ffd8a8" stroke="#e8590c" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="641.0" y="272" xml:space="preserve">country</tspan></text><rect x="606" y="280" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="606" y="302" width="70" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="496" y="340" xml:space="preserve">hot table: small, often-read columns</tspan></text><rect x="496" y="354" width="40" height="24" rx="3" fill="#d0bfff" stroke="#6741d9" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="516.0" y="370" xml:space="preserve">id</tspan></text><rect x="496" y="378" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="496" y="400" width="40" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="536" y="354" width="80" height="24" rx="3" fill="#d0bfff" stroke="#6741d9" stroke-width="1.2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="576.0" y="370" xml:space="preserve">bio (big)</tspan></text><rect x="536" y="378" width="80" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="536" y="400" width="80" height="22" rx="2" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="496" y="438" xml:space="preserve">cold table: big/rare columns, join on id</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="730" y="276" xml:space="preserve">Or move whole</tspan><tspan x="730" y="292" xml:space="preserve">features/tables to their</tspan><tspan x="730" y="308" xml:space="preserve">own database:</tspan><tspan x="730" y="324" xml:space="preserve">functional split</tspan><tspan x="730" y="340" xml:space="preserve">('vertical sharding')</tspan></text></svg>