<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Where to cache: each layer is closer, faster and harder to invalidate</tspan></text><rect x="20" y="70" width="160" height="64" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="100.0" y="97.55" xml:space="preserve">Client</tspan><tspan x="100.0" y="115.55" xml:space="preserve">browser / app</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="100" y="164" xml:space="preserve">~0 ms</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="100" y="190" xml:space="preserve">HTTP cache, localStorage</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle" font-style="italic"><tspan x="100" y="214" xml:space="preserve">can't invalidate remotely</tspan></text><rect x="200" y="70" width="160" height="64" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="280.0" y="106.55" xml:space="preserve">CDN / edge</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="280" y="164" xml:space="preserve">20-40 ms</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="280" y="190" xml:space="preserve">images, video, static, public API</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle" font-style="italic"><tspan x="280" y="214" xml:space="preserve">purge / versioned URLs</tspan></text><rect x="380" y="70" width="160" height="64" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="460.0" y="97.55" xml:space="preserve">App server</tspan><tspan x="460.0" y="115.55" xml:space="preserve">in-process</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="460" y="164" xml:space="preserve">~0.001 ms</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="460" y="190" xml:space="preserve">config, flags, tiny hot data</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle" font-style="italic"><tspan x="460" y="214" xml:space="preserve">per-instance, can diverge</tspan></text><rect x="560" y="70" width="160" height="64" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="640.0" y="97.55" xml:space="preserve">External cache</tspan><tspan x="640.0" y="115.55" xml:space="preserve">Redis / Memcached</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="640" y="164" xml:space="preserve">~1 ms</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="640" y="190" xml:space="preserve">profiles, feeds, query results</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle" font-style="italic"><tspan x="640" y="214" xml:space="preserve">default answer in interviews</tspan></text><rect x="740" y="70" width="160" height="64" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="820.0" y="97.55" xml:space="preserve">Database</tspan><tspan x="820.0" y="115.55" xml:space="preserve">buffer pool</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="820" y="164" xml:space="preserve">10-50 ms</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="820" y="190" xml:space="preserve">pages, indexes (built-in)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle" font-style="italic"><tspan x="820" y="214" xml:space="preserve">automatic</tspan></text><path d="M182,102 L218,102" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M362,102 L398,102" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M542,102 L578,102" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M722,102 L758,102" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="20" y="158" xml:space="preserve">latency</tspan></text><rect x="20" y="246" width="900" height="64" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="34" y="270" xml:space="preserve">Request flows left → right and stops at the first hit. Interview order: start with an external cache (Redis),</tspan><tspan x="34" y="288" xml:space="preserve">add a CDN for static media, add in-process only for tiny very hot values, mention client caching for offline / HTTP caching.</tspan></text></svg>