<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Cache-aside consistency: why 'update DB then DELETE cache' is the safe default</tspan></text><rect x="20" y="56" width="440" height="340" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="440" height="28" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">Race: read-fill overwrites a newer write (stale forever)</tspan></text><rect x="35" y="96" width="110" height="26" rx="6" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="90.0" y="112.85" xml:space="preserve">Reader A</tspan></text><path d="M90,124 L90,380" fill="none" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="175" y="96" width="110" height="26" rx="6" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="230.0" y="112.85" xml:space="preserve">Writer B</tspan></text><path d="M230,124 L230,380" fill="none" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="6 4"/><rect x="315" y="96" width="110" height="26" rx="6" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="370.0" y="112.85" xml:space="preserve">Cache / DB</tspan></text><path d="M370,124 L370,380" fill="none" stroke="#ced4da" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M90,146 L362,146" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="230.0" y="140" xml:space="preserve">1 miss → read DB (v1)</tspan></text><path d="M230,186 L362,186" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="300.0" y="180" xml:space="preserve">2 write DB (v2)</tspan></text><path d="M230,226 L362,226" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="300.0" y="220" xml:space="preserve">3 delete cache key</tspan></text><path d="M90,266 L362,266" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="230.0" y="260" xml:space="preserve">4 SET cache = v1  (stale!)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="32" y="316" xml:space="preserve">Cache now holds v1 while DB holds v2, until the TTL</tspan><tspan x="32" y="332" xml:space="preserve">expires. Rare (needs a slow reader) but real.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="358" xml:space="preserve">Mitigate: TTL on every key, delayed double-delete, version</tspan><tspan x="32" y="374" xml:space="preserve">numbers / CAS on set, or CDC-driven invalidation.</tspan></text><rect x="480" y="56" width="440" height="340" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="480" y="56" width="440" height="28" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="492" y="76" xml:space="preserve">Invalidation options, weakest to strongest</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="494" y="104" xml:space="preserve">TTL only</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="494" y="119" xml:space="preserve">Simple; stale up to TTL. Fine for feeds, counts, analytics.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="494" y="140" xml:space="preserve">Delete on write</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="494" y="155" xml:space="preserve">DB commit, then DEL key. Next read refills. Small race above.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="494" y="176" xml:space="preserve">Update cache on write</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="494" y="191" xml:space="preserve">Two writers can interleave and leave the older value. Avoid.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="494" y="212" xml:space="preserve">Write-through</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="494" y="227" xml:space="preserve">Cache writes DB synchronously. Dual-write failures still need</tspan><tspan x="494" y="242" xml:space="preserve">handling.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="494" y="263" xml:space="preserve">CDC / binlog → invalidator</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="494" y="278" xml:space="preserve">Debezium or DB log emits changes, a worker deletes keys.</tspan><tspan x="494" y="293" xml:space="preserve">Retryable, ordered, no dual write.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="494" y="314" xml:space="preserve">Versioned keys</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="494" y="329" xml:space="preserve">user:42:v17; bump the version on change. Old keys just expire.</tspan><tspan x="494" y="344" xml:space="preserve">Great for CDN assets.</tspan></text></svg>