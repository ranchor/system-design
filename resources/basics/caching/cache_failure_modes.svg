<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Cache failure modes and the defense for each</tspan></text><rect x="20" y="56" width="295" height="176" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="295" height="28" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="30" y="75" xml:space="preserve">Stampede (hot key expires)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="30" y="108" xml:space="preserve">Many requests miss at once and all hit the DB.</tspan><tspan x="30" y="124" xml:space="preserve"></tspan><tspan x="30" y="140" xml:space="preserve">Fix: single-flight / per-key lock, serve stale</tspan><tspan x="30" y="156" xml:space="preserve">while one request refreshes (stale-while-</tspan><tspan x="30" y="172" xml:space="preserve">revalidate), refresh early (probabilistic).</tspan></text><rect x="325" y="56" width="295" height="176" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="325" y="56" width="295" height="28" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="335" y="75" xml:space="preserve">Avalanche (mass expiry / cache down)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="335" y="108" xml:space="preserve">Lots of keys share a TTL, or the cache cluster dies;</tspan><tspan x="335" y="124" xml:space="preserve">the DB takes the full load.</tspan><tspan x="335" y="140" xml:space="preserve"></tspan><tspan x="335" y="156" xml:space="preserve">Fix: TTL + random jitter, replicas / HA, circuit</tspan><tspan x="335" y="172" xml:space="preserve">breaker + load shedding, warm before cutover.</tspan></text><rect x="630" y="56" width="295" height="176" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="630" y="56" width="295" height="28" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="640" y="75" xml:space="preserve">Penetration (keys that don't exist)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="640" y="108" xml:space="preserve">Requests for missing ids always miss and hit the DB;</tspan><tspan x="640" y="124" xml:space="preserve">attackers can exploit it.</tspan><tspan x="640" y="140" xml:space="preserve"></tspan><tspan x="640" y="156" xml:space="preserve">Fix: cache the 'not found' with a short TTL,</tspan><tspan x="640" y="172" xml:space="preserve">Bloom filter of valid ids, validate input.</tspan></text><rect x="20" y="246" width="295" height="176" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="246" width="295" height="28" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="30" y="265" xml:space="preserve">Hot key (one key, one shard)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="30" y="298" xml:space="preserve">A single viral key saturates one Redis node even</tspan><tspan x="30" y="314" xml:space="preserve">at 100% hit rate.</tspan><tspan x="30" y="330" xml:space="preserve"></tspan><tspan x="30" y="346" xml:space="preserve">Fix: replicate the key (key#1..n, random read),</tspan><tspan x="30" y="362" xml:space="preserve">small in-process L1 with short TTL, rate limit.</tspan></text><rect x="325" y="246" width="295" height="176" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="325" y="246" width="295" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="335" y="265" xml:space="preserve">Stale data / inconsistency</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="335" y="298" xml:space="preserve">DB and cache disagree after a write.</tspan><tspan x="335" y="314" xml:space="preserve"></tspan><tspan x="335" y="330" xml:space="preserve"></tspan><tspan x="335" y="346" xml:space="preserve">Fix: invalidate on write, TTL as backstop,</tspan><tspan x="335" y="362" xml:space="preserve">CDC invalidation, versioned keys.</tspan></text><rect x="630" y="246" width="295" height="176" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="630" y="246" width="295" height="28" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="640" y="265" xml:space="preserve">Cold start / eviction churn</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="640" y="298" xml:space="preserve">Empty or too-small cache means a low hit ratio and</tspan><tspan x="640" y="314" xml:space="preserve">slow, DB-bound requests.</tspan><tspan x="640" y="330" xml:space="preserve"></tspan><tspan x="640" y="346" xml:space="preserve">Fix: pre-warm hot keys, size to working set,</tspan><tspan x="640" y="362" xml:space="preserve">track hit ratio, LRU / LFU suited to the access pattern.</tspan></text></svg>