<svg xmlns="http://www.w3.org/2000/svg" width="684" height="474" viewBox="0 0 684 474"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">Availability: components in series vs parallel</tspan></text><rect x="20" y="60" width="640" height="150" rx="12" fill="#fff5f5" stroke="#e03131" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e03131" font-weight="bold"><tspan x="30" y="80">Series: request needs ALL components</tspan></text><rect x="50" y="110" width="150" height="60" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="125" y="135">LB</tspan><tspan x="125" y="155">99.99%</tspan></text><path d="M200,140 L260,140" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="260" y="110" width="150" height="60" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="335" y="135">App</tspan><tspan x="335" y="155">99.9%</tspan></text><path d="M410,140 L470,140" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><path d="M470,116.66666666666667 L470,163.33333333333334 A75.0,11.666666666666666 0 0 0 620,163.33333333333334 L620,116.66666666666667" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><ellipse cx="545.0" cy="116.66666666666667" rx="75.0" ry="11.666666666666666" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="545" y="141">DB</tspan><tspan x="545" y="161">99.9%</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c92a2a"><tspan x="50" y="196">A = 0.9999 x 0.999 x 0.999 = 99.79%  (~18 h downtime/yr)</tspan></text><rect x="20" y="240" width="640" height="210" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f9e44" font-weight="bold"><tspan x="30" y="260">Parallel: request needs ANY ONE replica</tspan></text><rect x="50" y="315" width="150" height="60" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="125" y="350">Client</tspan></text><path d="M200,335 L300,290" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><path d="M200,355 L300,395" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="300" y="265" width="170" height="55" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="385" y="298">Replica A  99.9%</tspan></text><rect x="300" y="370" width="170" height="55" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="385" y="403">Replica B  99.9%</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2b8a3e"><tspan x="490" y="329">A = 1 - (0.001)^2</tspan><tspan x="490" y="348">  = 99.9999%</tspan></text></svg>