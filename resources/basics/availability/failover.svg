<svg xmlns="http://www.w3.org/2000/svg" width="724" height="414" viewBox="0 0 724 414"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">Failover: active-passive vs active-active</tspan></text><rect x="20" y="60" width="330" height="330" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e8590c" font-weight="bold"><tspan x="30" y="80">Active-Passive</tspan></text><rect x="115" y="100" width="140" height="50" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="185" y="130">Clients</tspan></text><path d="M185,150 L120,220" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="113.22" y="174.25" width="78.56" height="21.5" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#343a40" text-anchor="middle"><tspan x="152" y="190">VIP / DNS</tspan></text><rect x="45" y="220" width="140" height="60" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="115" y="245">Active</tspan><tspan x="115" y="265">(serves traffic)</tspan></text><rect x="205" y="220" width="130" height="60" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="270" y="245">Passive</tspan><tspan x="270" y="265">(standby)</tspan></text><path d="M185,240 L205,240" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)"/><path d="M205,262 L185,262" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057"><tspan x="45" y="313">heartbeat + replication -&gt;</tspan><tspan x="45" y="331">on active failure: promote</tspan><tspan x="45" y="348">standby, move VIP, fence old</tspan></text><rect x="370" y="60" width="330" height="330" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f9e44" font-weight="bold"><tspan x="380" y="80">Active-Active</tspan></text><rect x="465" y="100" width="140" height="50" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="535" y="130">Clients</tspan></text><rect x="465" y="175" width="140" height="45" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="535" y="203">Load Balancer</tspan></text><path d="M535,150 L535,175" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="390" y="260" width="130" height="60" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="455" y="285">Node A</tspan><tspan x="455" y="305">(serves)</tspan></text><rect x="550" y="260" width="130" height="60" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="615" y="285">Node B</tspan><tspan x="615" y="305">(serves)</tspan></text><path d="M510,220 L455,260" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><path d="M560,220 L615,260" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><path d="M520,290 L550,290" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)" marker-start="url(#as0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057"><tspan x="390" y="348">both take traffic; LB drops a failed</tspan><tspan x="390" y="366">node; writes need conflict handling</tspan></text></svg>