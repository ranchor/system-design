<svg xmlns="http://www.w3.org/2000/svg" width="876" height="344" viewBox="0 0 876 344"><defs></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">Row vs columnar layout for SELECT avg(price) WHERE country=&#x27;US&#x27;</tspan></text><rect x="20" y="60" width="400" height="260" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e8590c" font-weight="bold"><tspan x="30" y="80">Row-oriented (CSV, Avro, OLTP pages)</tspan></text><rect x="40" y="100" width="360" height="45" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="220" y="127">id=1 | country | price | name | ts ...</tspan></text><rect x="40" y="160" width="360" height="45" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="220" y="187">id=2 | country | price | name | ts ...</tspan></text><rect x="40" y="220" width="360" height="45" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="220" y="247">id=3 | country | price | name | ts ...</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c92a2a"><tspan x="40" y="297">must read every whole row</tspan></text><rect x="440" y="60" width="400" height="260" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f9e44" font-weight="bold"><tspan x="450" y="80">Columnar (Parquet / ORC)</tspan></text><rect x="460" y="100" width="80" height="160" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="500" y="152">id</tspan><tspan x="500" y="168"></tspan><tspan x="500" y="184">1</tspan><tspan x="500" y="200">2</tspan><tspan x="500" y="217">3</tspan></text><rect x="552" y="100" width="80" height="160" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="592" y="152">country</tspan><tspan x="592" y="168"></tspan><tspan x="592" y="184">1</tspan><tspan x="592" y="200">2</tspan><tspan x="592" y="217">3</tspan></text><rect x="644" y="100" width="80" height="160" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="684" y="152">price</tspan><tspan x="684" y="168"></tspan><tspan x="684" y="184">1</tspan><tspan x="684" y="200">2</tspan><tspan x="684" y="217">3</tspan></text><rect x="736" y="100" width="80" height="160" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="776" y="152">name</tspan><tspan x="776" y="168"></tspan><tspan x="776" y="184">1</tspan><tspan x="776" y="200">2</tspan><tspan x="776" y="217">3</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#2b8a3e"><tspan x="460" y="297">read 2 columns; min/max stats skip row groups</tspan></text></svg>