<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Cassandra: consistent-hash ring, tunable quorums, LSM write path</tspan></text><rect x="20" y="56" width="380" height="340" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="380" height="28" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">Token ring (vnodes), RF = 3</tspan></text><path d="M200.0,117.0 L286.60254037844385,167.0" fill="none" stroke="#b197fc" stroke-width="3"/><path d="M286.60254037844385,167.0 L286.6025403784439,267.0" fill="none" stroke="#b197fc" stroke-width="3"/><path d="M286.6025403784439,267.0 L200.0,317.0" fill="none" stroke="#b197fc" stroke-width="3"/><path d="M200.0,317.0 L113.39745962155615,267.00000000000006" fill="none" stroke="#b197fc" stroke-width="3"/><path d="M113.39745962155615,267.00000000000006 L113.39745962155614,167.0" fill="none" stroke="#b197fc" stroke-width="3"/><path d="M113.39745962155614,167.0 L200.0,117.0" fill="none" stroke="#b197fc" stroke-width="3"/><circle cx="200.0" cy="117.0" r="19" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="200.0" y="122.0" xml:space="preserve">A</tspan></text><circle cx="286.60254037844385" cy="167.0" r="19" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="286.60254037844385" y="172.0" xml:space="preserve">B</tspan></text><circle cx="286.6025403784439" cy="267.0" r="19" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="286.6025403784439" y="272.0" xml:space="preserve">C</tspan></text><circle cx="200.0" cy="317.0" r="19" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="200.0" y="322.0" xml:space="preserve">D</tspan></text><circle cx="113.39745962155615" cy="267.00000000000006" r="19" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="113.39745962155615" y="272.00000000000006" xml:space="preserve">E</tspan></text><circle cx="113.39745962155614" cy="167.0" r="19" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="113.39745962155614" y="172.0" xml:space="preserve">F</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="200" y="211" xml:space="preserve">hash(partition key)</tspan><tspan x="200" y="226" xml:space="preserve">→ token → owner B</tspan><tspan x="200" y="241" xml:space="preserve">+ next 2 nodes clockwise</tspan><tspan x="200" y="256" xml:space="preserve">= replicas B, C, D</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="366" xml:space="preserve">Any node can coordinate; it routes to the replicas.</tspan><tspan x="32" y="381" xml:space="preserve">Vnodes (many tokens per node) even out load.</tspan></text><rect x="420" y="56" width="460" height="340" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="420" y="56" width="460" height="28" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="432" y="76" xml:space="preserve">Tunable consistency (per query)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="432" y="104" xml:space="preserve">N = replication factor (3).  R = replicas read.  W = replicas written.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold"><tspan x="432" y="124" xml:space="preserve">If  R + W &gt; N  →  every read overlaps the latest write.</tspan></text><rect x="432" y="142" width="130" height="24" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="497" y="158" xml:space="preserve">ONE / LOCAL_ONE</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="572" y="158" xml:space="preserve">fastest, may be stale</tspan></text><rect x="432" y="172" width="130" height="24" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="497" y="188" xml:space="preserve">QUORUM (2 of 3)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="572" y="188" xml:space="preserve">R=W=QUORUM → read-your-writes</tspan></text><rect x="432" y="202" width="130" height="24" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="497" y="218" xml:space="preserve">LOCAL_QUORUM</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="572" y="218" xml:space="preserve">quorum inside the local DC (multi-DC default choice)</tspan></text><rect x="432" y="232" width="130" height="24" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="497" y="248" xml:space="preserve">ALL</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="572" y="248" xml:space="preserve">slowest, any dead replica fails the op</tspan></text><rect x="432" y="262" width="130" height="24" rx="5" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="497" y="278" xml:space="preserve">SERIAL / LWT</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="572" y="278" xml:space="preserve">Paxos compare-and-set per partition (IF NOT EXISTS)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="432" y="310" xml:space="preserve">Conflicts: last-write-wins per column by timestamp (clock skew matters!).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="432" y="328" xml:space="preserve">Repairs: hinted handoff → read repair → anti-entropy repair (Merkle trees).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="432" y="346" xml:space="preserve">Failure detection: gossip + phi-accrual detector.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="432" y="364" xml:space="preserve">No leader: any replica takes writes; Cassandra is AP by default.</tspan></text><rect x="20" y="416" width="860" height="190" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="440" xml:space="preserve">Inside one node (LSM tree)</tspan></text><rect x="34" y="456" width="120" height="44" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="94.0" y="474.35" xml:space="preserve">Write</tspan><tspan x="94.0" y="489.35" xml:space="preserve">(mutation)</tspan></text><rect x="190" y="456" width="130" height="44" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="255.0" y="474.35" xml:space="preserve">Commit log</tspan><tspan x="255.0" y="489.35" xml:space="preserve">(append, durable)</tspan></text><rect x="356" y="456" width="130" height="44" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="421.0" y="474.35" xml:space="preserve">Memtable</tspan><tspan x="421.0" y="489.35" xml:space="preserve">(in memory, sorted)</tspan></text><rect x="522" y="456" width="130" height="44" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="587.0" y="474.35" xml:space="preserve">SSTables</tspan><tspan x="587.0" y="489.35" xml:space="preserve">(immutable, on disk)</tspan></text><rect x="688" y="456" width="180" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="778.0" y="474.35" xml:space="preserve">Compaction</tspan><tspan x="778.0" y="489.35" xml:space="preserve">merges, drops tombstones</tspan></text><path d="M154,478 L190,478" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M320,478 L356,478" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M486,478 L522,478" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M652,478 L688,478" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="34" y="524" xml:space="preserve">Writes are sequential appends (fast); no read-before-write. Deletes write tombstones that live until gc_grace_seconds (default 10 days) and compaction.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="34" y="544" xml:space="preserve">Read: merge memtable + candidate SSTables. A per-SSTable Bloom filter skips files that can't contain the key; a partition index finds the offset.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="34" y="564" xml:space="preserve">Cost of reads grows with the number of SSTables touched → compaction strategy (STCS / LCS / TWCS / UCS) is a tuning lever, not an afterthought.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c92a2a" font-weight="bold"><tspan x="34" y="590" xml:space="preserve">Rule: model one table per query; keep partitions bounded (time-bucket the key); avoid scatter-gather, big IN lists, and deletes-as-queue.</tspan></text></svg>