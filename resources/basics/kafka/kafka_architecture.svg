<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Kafka: partitioned, replicated log; consumer groups read by offset</tspan></text><rect x="20" y="70" width="110" height="44" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="75.0" y="95.85" xml:space="preserve">Producer A</tspan></text><rect x="20" y="140" width="110" height="44" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="75.0" y="165.85" xml:space="preserve">Producer B</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="214" xml:space="preserve">key → hash → partition</tspan><tspan x="20" y="229" xml:space="preserve">same key = same order</tspan></text><rect x="170" y="56" width="470" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="170" y="56" width="470" height="28" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="182" y="76" xml:space="preserve">Topic 'orders' (3 partitions, replication factor 3)</tspan></text><rect x="186" y="96" width="140" height="28" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="256.0" y="113.85" xml:space="preserve">Broker 1</tspan></text><rect x="186" y="134" width="140" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="256.0" y="153.675" xml:space="preserve">P0 leader</tspan></text><rect x="186" y="174" width="140" height="32" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="256.0" y="193.675" xml:space="preserve">P1 follower</tspan></text><rect x="186" y="214" width="140" height="32" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="256.0" y="233.675" xml:space="preserve">P2 follower</tspan></text><rect x="338" y="96" width="140" height="28" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="408.0" y="113.85" xml:space="preserve">Broker 2</tspan></text><rect x="338" y="134" width="140" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="408.0" y="153.675" xml:space="preserve">P1 leader</tspan></text><rect x="338" y="174" width="140" height="32" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="408.0" y="193.675" xml:space="preserve">P2 follower</tspan></text><rect x="338" y="214" width="140" height="32" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="408.0" y="233.675" xml:space="preserve">P0 follower</tspan></text><rect x="490" y="96" width="140" height="28" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="560.0" y="113.85" xml:space="preserve">Broker 3</tspan></text><rect x="490" y="134" width="140" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="560.0" y="153.675" xml:space="preserve">P2 leader</tspan></text><rect x="490" y="174" width="140" height="32" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="560.0" y="193.675" xml:space="preserve">P0 follower</tspan></text><rect x="490" y="214" width="140" height="32" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="560.0" y="233.675" xml:space="preserve">P1 follower</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="182" y="270" xml:space="preserve">Each partition = ordered append-only log: offsets 0,1,2,3…</tspan><tspan x="182" y="286" xml:space="preserve">Writes go to the leader; followers in the ISR replicate.</tspan><tspan x="182" y="302" xml:space="preserve">acks=all + min.insync.replicas=2 survives one broker loss.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="182" y="330" xml:space="preserve">Controller (KRaft quorum) manages leaders and metadata.</tspan></text><path d="M132,92 L168,120" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M132,162 L168,150" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="680" y="56" width="240" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="680" y="56" width="240" height="28" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="692" y="76" xml:space="preserve">Consumer group 'billing'</tspan></text><rect x="696" y="98" width="208" height="34" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="800.0" y="118.675" xml:space="preserve">Consumer 1 ← P0</tspan></text><rect x="696" y="142" width="208" height="34" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="800.0" y="162.675" xml:space="preserve">Consumer 2 ← P1</tspan></text><rect x="696" y="186" width="208" height="34" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="800.0" y="206.675" xml:space="preserve">Consumer 3 ← P2</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="696" y="240" xml:space="preserve">Each partition is read by exactly one</tspan><tspan x="696" y="256" xml:space="preserve">consumer in a group. Parallelism ≤</tspan><tspan x="696" y="272" xml:space="preserve">number of partitions. A second group</tspan><tspan x="696" y="288" xml:space="preserve">('analytics') gets its own copy of all</tspan><tspan x="696" y="304" xml:space="preserve">events and its own offsets.</tspan></text><path d="M642,160 L678,160" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="20" y="385" xml:space="preserve">Retention is by time/size, not by consumption, so you can replay. Offsets are committed per group (__consumer_offsets).</tspan></text></svg>