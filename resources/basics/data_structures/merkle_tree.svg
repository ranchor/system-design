<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Merkle tree: compare two replicas by hash, descend only where they differ</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="40" y="70" xml:space="preserve">Replica A</tspan></text><rect x="130" y="86" width="100" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="180.0" y="105.675" xml:space="preserve">root</tspan></text><rect x="70" y="150" width="90" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="115.0" y="169.675" xml:space="preserve">h0</tspan></text><path d="M180,120 L115,148" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="210" y="150" width="90" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="255.0" y="169.675" xml:space="preserve">h1</tspan></text><path d="M180,120 L255,148" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="40" y="220" width="66" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-famil