ke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="575.0" y="169.675" xml:space="preserve">h0</tspan></text><path d="M640,120 L575,148" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="670" y="150" width="90" height="32" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="715.0" y="169.675" xml:space="preserve">h1</tspan></text><path d="M640,120 L715,148" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="500" y="220" width="66" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="533.0" y="239.5" xml:space="preserve">leaf 0</tspan></text><rect x="572" y="220" width="66" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="605.0" y="239.5" xml:space="preserve">leaf 1</tspan></text><rect x="644" y="220" width="66" height="32" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="677.0" y="239.5" xml:space="preserve">leaf 2</tspan></text><rect x="716" y="220" width="66" height="32" rx="8" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="749.0" y="239.5" xml:space="preserve">leaf 3</tspan></text><path d="M575,184 L533,218" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M575,184 L605,218" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M715,184 L677,218" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M715,184 L749,218" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="40" y="290" xml:space="preserve">Roots differ → compare children → follow the differing path → sync only leaf 3 (log N hash comparisons, not N rows).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="40" y="312" xml:space="preserve">Used in Dynamo/Cassandra anti-entropy repair, Git, blockchains, certificate transparency, S3-style integrity checks.</tspan></text></svg>