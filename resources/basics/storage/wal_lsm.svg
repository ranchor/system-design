<svg xmlns="http://www.w3.org/2000/svg" width="940" height="400" viewBox="0 0 940 400"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">WAL + LSM tree: sequential writes first, merge in the background</tspan></text><rect x="20" y="150" width="90" height="44" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="65.0" y="175.85" xml:space="preserve">Write</tspan></text><rect x="150" y="90" width="170" height="44" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="235.0" y="108.675" xml:space="preserve">WAL / commit log</tspan><tspan x="235.0" y="122.675" xml:space="preserve">append + fsync (durable)</tspan></text><rect x="150" y="200" width="170" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="235.0" y="218.675" xml:space="preserve">Memtable</tspan><tspan x="235.0" y="232.675" xml:space="preserve">sorted, in memory</tspan></text><path d="M112,165 L148,115" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M112,180 L148,220" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="150" y="262" xml:space="preserve">1. append to WAL   2. insert in memtable   3. ack</tspan></text><rect x="380" y="200" width="130" height="44" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="445.0" y="225.675" xml:space="preserve">flush when full</tspan></text><path d="M322,222 L378,222" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="550" y="60" width="370" height="310" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="562" y="80" xml:space="preserve">On disk: immutable sorted files (SSTables)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="562" y="114" xml:space="preserve">L0</tspan></text><rect x="596" y="98" width="36" height="34" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="640" y="98" width="36" height="34" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="684" y="98" width="36" height="34" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="728" y="98" width="36" height="34" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="562" y="176" xml:space="preserve">L1</tspan></text><rect x="596" y="160" width="60" height="34" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="664" y="160" width="60" height="34" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="732" y="160" width="60" height="34" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="562" y="238" xml:space="preserve">L2</tspan></text><rect x="596" y="222" width="100" height="34" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="704" y="222" width="100" height="34" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="562" y="300" xml:space="preserve">L3</tspan></text><rect x="596" y="284" width="160" height="34" rx="4" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="562" y="350" xml:space="preserve">Compaction merges files down, drops overwritten/deleted keys</tspan></text><path d="M512,222 L548,222" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="300" width="500" height="80" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="322" xml:space="preserve">Read: memtable → newest SSTables → older (Bloom filters skip files).</tspan><tspan x="32" y="338" xml:space="preserve">Amplification: write (rewrites), read (many files), space (dead data).</tspan><tspan x="32" y="354" xml:space="preserve">STCS = write-friendly, LCS = read/space-friendly, TWCS = time-series.</tspan></text></svg>