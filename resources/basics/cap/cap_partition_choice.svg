<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">CAP in one picture: a partition forces a choice between C and A</tspan></text><rect x="20" y="56" width="440" height="260" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="440" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">CP: choose consistency</tspan></text><rect x="40" y="100" width="120" height="40" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="100.0" y="116.675" xml:space="preserve">USA server</tspan><tspan x="100.0" y="130.675" xml:space="preserve">name = 'Ann'</tspan></text><rect x="320" y="100" width="120" height="40" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="380.0" y="116.675" xml:space="preserve">Europe server</tspan><tspan x="380.0" y="130.675" xml:space="preserve">name = 'Old'</tspan></text><path d="M162,120 L318,120" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e03131" font-weight="bold" text-anchor="middle"><tspan x="240" y="112" xml:space="preserve">✕ partition</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="40" y="170" xml:space="preserve">User A wrote 'Ann' in the USA; replication to Europe is cut.</tspan></text><rect x="40" y="186" width="400" height="30" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="240.0" y="205.025" xml:space="preserve">Europe read → ERROR / timeout</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="40" y="240" xml:space="preserve">Refuse to answer (or block) until the replica</tspan><tspan x="40" y="257" xml:space="preserve">can prove it is up to date.</tspan><tspan x="40" y="274" xml:space="preserve">Correct but unavailable for those users.</tspan><tspan x="40" y="291" xml:space="preserve">Booking, inventory, balances, locks.</tspan></text><rect x="480" y="56" width="440" height="260" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="480" y="56" width="440" height="28" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="492" y="76" xml:space="preserve">AP: choose availability</tspan></text><rect x="500" y="100" width="120" height="40" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="560.0" y="116.675" xml:space="preserve">USA server</tspan><tspan x="560.0" y="130.675" xml:space="preserve">name = 'Ann'</tspan></text><rect x="780" y="100" width="120" height="40" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="840.0" y="116.675" xml:space="preserve">Europe server</tspan><tspan x="840.0" y="130.675" xml:space="preserve">name = 'Old'</tspan></text><path d="M622,120 L778,120" fill="none" stroke="#e03131" stroke-width="3" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e03131" font-weight="bold" text-anchor="middle"><tspan x="700" y="112" xml:space="preserve">✕ partition</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="500" y="170" xml:space="preserve">User A wrote 'Ann' in the USA; replication to Europe is cut.</tspan></text><rect x="500" y="186" width="400" height="30" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="700.0" y="205.025" xml:space="preserve">Europe read → OLD name (stale)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="500" y="240" xml:space="preserve">Answer from the local copy, possibly stale.</tspan><tspan x="500" y="257" xml:space="preserve">Reconcile when the partition heals.</tspan><tspan x="500" y="274" xml:space="preserve">Always responds; may be briefly wrong.</tspan><tspan x="500" y="291" xml:space="preserve">Profiles, feeds, likes, catalogs.</tspan></text></svg>