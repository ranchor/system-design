<svg xmlns="http://www.w3.org/2000/svg" width="940" height="560" viewBox="0 0 940 560"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">PACELC: if Partition → A or C; Else (normal operation) → Latency or Consistency</tspan></text><rect x="360" y="56" width="220" height="40" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="470.0" y="80.2" xml:space="preserve">Is the network partitioned?</tspan></text><path d="M400,98 L230,150" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="290" y="118" xml:space="preserve">YES (rare)</tspan></text><path d="M540,98 L710,150" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="640" y="118" xml:space="preserve">NO (most of the time)</tspan></text><rect x="100" y="150" width="260" height="44" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="230.0" y="168.025" xml:space="preserve">P branch = CAP</tspan><tspan x="230.0" y="184.025" xml:space="preserve">choose Availability or Consistency</tspan></text><rect x="580" y="150" width="260" height="44" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="710.0" y="168.025" xml:space="preserve">E branch = the extension</tspan><tspan x="710.0" y="184.025" xml:space="preserve">choose Latency or Consistency</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal"><tspan x="100" y="222" xml:space="preserve">PA: keep answering, maybe stale</tspan><tspan x="100" y="240" xml:space="preserve">PC: reject / block to stay correct</tspan></text><rect x="430" y="214" width="490" height="320" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="442" y="236" xml:space="preserve">Why is there a trade-off with NO failure?</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="442" y="256" xml:space="preserve">Replicas live in different AZs / regions, so any coordination costs a network round trip.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold"><tspan x="442" y="330" xml:space="preserve">EC (consistency first):</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="442" y="348" xml:space="preserve">write → leader → wait for replica ack → reply</tspan><tspan x="442" y="364" xml:space="preserve">read → leader / quorum (never a lagging copy)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="442" y="386" xml:space="preserve">Latency ≈ local + cross-AZ/region RTT (≈1-2 ms in-AZ, ≈60-150 ms across regions)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold"><tspan x="442" y="420" xml:space="preserve">EL (latency first):</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="442" y="438" xml:space="preserve">write → leader → reply immediately; replicate in background</tspan><tspan x="442" y="454" xml:space="preserve">read → nearest replica, possibly a few ms to seconds stale</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="442" y="476" xml:space="preserve">Latency ≈ local only, but a read right after a write can miss it</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="442" y="512" xml:space="preserve">No partition needed: this is just 'how long do I wait for the other copies?'</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="262" xml:space="preserve">Common labels (config-dependent):</tspan></text><rect x="20" y="282" width="62" height="34" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="302.675" xml:space="preserve">PA/EL</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="92" y="296" xml:space="preserve">Dynamo-style: DynamoDB (default), Cassandra at</tspan><tspan x="92" y="309" xml:space="preserve">ONE, Riak, CDNs, DNS</tspan></text><rect x="20" y="340" width="62" height="34" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="360.675" xml:space="preserve">PC/EC</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="92" y="354" xml:space="preserve">Spanner, CockroachDB, Aurora DSQL,</tspan><tspan x="92" y="367" xml:space="preserve">etcd/ZooKeeper, most RDBMS clusters, MongoDB</tspan><tspan x="92" y="380" xml:space="preserve">(majority)</tspan></text><rect x="20" y="398" width="62" height="34" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="418.675" xml:space="preserve">PA/EC</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="92" y="412" xml:space="preserve">Cassandra / DynamoDB with QUORUM or strong</tspan><tspan x="92" y="425" xml:space="preserve">reads: available in a partition, strong</tspan><tspan x="92" y="438" xml:space="preserve">otherwise (hybrid)</tspan></text><rect x="20" y="456" width="62" height="34" rx="8" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="51.0" y="476.675" xml:space="preserve">PC/EL</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="92" y="470" xml:space="preserve">PNUTS-style: strict during partition, async</tspan><tspan x="92" y="483" xml:space="preserve">otherwise (rare)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="520" xml:space="preserve">Many systems let you pick per request</tspan><tspan x="20" y="534" xml:space="preserve">(consistency level), so a database is not</tspan><tspan x="20" y="548" xml:space="preserve">one fixed label.</tspan></text></svg>