<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">'SQL doesn't scale'? The relational scaling ladder</tspan></text><rect x="20" y="300" width="136" height="130" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#868e96" font-weight="bold"><tspan x="30" y="324" xml:space="preserve">0</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="54" y="320" xml:space="preserve">Single node</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="30" y="362" xml:space="preserve">+ right indexes,</tspan><tspan x="30" y="376" xml:space="preserve">fix N+1 queries,</tspan><tspan x="30" y="390" xml:space="preserve">connection pooling</tspan></text><rect x="164" y="258" width="136" height="172" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#1971c2" font-weight="bold"><tspan x="174" y="282" xml:space="preserve">1</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="198" y="278" xml:space="preserve">Read replicas</tspan><tspan x="198" y="293" xml:space="preserve">+ cache</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="174" y="320" xml:space="preserve">Replicas for reads,</tspan><tspan x="174" y="334" xml:space="preserve">Redis / CDN in front</tspan></text><rect x="308" y="216" width="136" height="214" rx="8" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#0c8599" font-weight="bold"><tspan x="318" y="240" xml:space="preserve">2</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="342" y="236" xml:space="preserve">Scale up +</tspan><tspan x="342" y="251" xml:space="preserve">partition tables</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="318" y="278" xml:space="preserve">Bigger box, NVMe,</tspan><tspan x="318" y="292" xml:space="preserve">table partitioning,</tspan><tspan x="318" y="306" xml:space="preserve">archive cold data</tspan></text><rect x="452" y="174" width="136" height="256" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#2f9e44" font-weight="bold"><tspan x="462" y="198" xml:space="preserve">3</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="486" y="194" xml:space="preserve">Split by</tspan><tspan x="486" y="209" xml:space="preserve">service</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="462" y="236" xml:space="preserve">Separate DB per</tspan><tspan x="462" y="250" xml:space="preserve">bounded context</tspan></text><rect x="596" y="132" width="136" height="298" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#f08c00" font-weight="bold"><tspan x="606" y="156" xml:space="preserve">4</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="630" y="152" xml:space="preserve">Shard</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="606" y="194" xml:space="preserve">App-level or Vitess /</tspan><tspan x="606" y="208" xml:space="preserve">Citus: shard key</tspan><tspan x="606" y="222" xml:space="preserve">(user_id, tenant_id)</tspan></text><rect x="740" y="90" width="136" height="340" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="20" fill="#6741d9" font-weight="bold"><tspan x="750" y="114" xml:space="preserve">5</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="774" y="110" xml:space="preserve">NewSQL /</tspan><tspan x="774" y="125" xml:space="preserve">distributed SQL</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="750" y="152" xml:space="preserve">Spanner, CockroachDB,</tspan><tspan x="750" y="166" xml:space="preserve">TiDB, YugabyteDB,</tspan><tspan x="750" y="180" xml:space="preserve">Aurora DSQL</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="452" xml:space="preserve">Pain that pushes you up a rung:</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c92a2a" font-weight="normal"><tspan x="20" y="470" xml:space="preserve">Most apps never</tspan><tspan x="20" y="483" xml:space="preserve">leave this rung</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c92a2a" font-weight="normal"><tspan x="164" y="470" xml:space="preserve">Replication lag,</tspan><tspan x="164" y="483" xml:space="preserve">invalidation</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c92a2a" font-weight="normal"><tspan x="308" y="470" xml:space="preserve">Cost, single</tspan><tspan x="308" y="483" xml:space="preserve">write primary</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c92a2a" font-weight="normal"><tspan x="452" y="470" xml:space="preserve">Cross-service joins</tspan><tspan x="452" y="483" xml:space="preserve">and transactions</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c92a2a" font-weight="normal"><tspan x="596" y="470" xml:space="preserve">Cross-shard queries,</tspan><tspan x="596" y="483" xml:space="preserve">resharding, hot shards</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#c92a2a" font-weight="normal"><tspan x="740" y="470" xml:space="preserve">Commit latency,</tspan><tspan x="740" y="483" xml:space="preserve">cost, SQL gaps</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" font-weight="normal" text-anchor="end" font-style="italic"><tspan x="880" y="56" xml:space="preserve">Move up only when metrics say so →</tspan></text></svg>