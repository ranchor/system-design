<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Distributed SQL (NewSQL): SQL on top, consensus-replicated shards below</tspan></text><rect x="220" y="58" width="460" height="40" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="450.0" y="82.375" xml:space="preserve">Applications  (Postgres / MySQL wire protocol)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="134" xml:space="preserve">SQL layer</tspan><tspan x="20" y="150" xml:space="preserve">(stateless)</tspan></text><rect x="220" y="114" width="140" height="52" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="290.0" y="136.35" xml:space="preserve">SQL gateway</tspan><tspan x="290.0" y="151.35" xml:space="preserve">parse · plan · route</tspan></text><path d="M290,98 L290,114" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="380" y="114" width="140" height="52" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="450.0" y="136.35" xml:space="preserve">SQL gateway</tspan><tspan x="450.0" y="151.35" xml:space="preserve">parse · plan · route</tspan></text><path d="M450,98 L450,114" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="540" y="114" width="140" height="52" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="610.0" y="136.35" xml:space="preserve">SQL gateway</tspan><tspan x="610.0" y="151.35" xml:space="preserve">parse · plan · route</tspan></text><path d="M610,98 L610,114" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="204" xml:space="preserve">Transaction layer</tspan></text><rect x="220" y="190" width="460" height="44" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="450" y="208" xml:space="preserve">MVCC timestamps (HLC / TrueTime)  ·  distributed commit</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="450" y="224" xml:space="preserve">2PC across the ranges a transaction touches</tspan></text><path d="M290,166 L290,190" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M450,166 L450,190" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M610,166 L610,190" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="296" xml:space="preserve">Ranges / shards</tspan><tspan x="20" y="312" xml:space="preserve">(auto-split,</tspan><tspan x="20" y="328" xml:space="preserve">auto-rebalanced)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="220" y="258" xml:space="preserve">Range 1  [a – f]  = one Raft/Paxos group of 3 replicas</tspan></text><rect x="220" y="262" width="140" height="42" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="290.0" y="286.675" xml:space="preserve">LEADER  (Zone A)</tspan></text><rect x="380" y="262" width="140" height="42" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="450.0" y="286.675" xml:space="preserve">follower  (Zone B)</tspan></text><rect x="540" y="262" width="140" height="42" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="610.0" y="286.675" xml:space="preserve">follower  (Zone C)</tspan></text><path d="M360,283 L380,283" fill="none" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#as)"/><path d="M520,283 L540,283" fill="none" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#as)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="220" y="340" xml:space="preserve">Range 2  [g – m]  = one Raft/Paxos group of 3 replicas</tspan></text><rect x="220" y="344" width="140" height="42" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="290.0" y="368.675" xml:space="preserve">follower  (Zone A)</tspan></text><rect x="380" y="344" width="140" height="42" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="450.0" y="368.675" xml:space="preserve">LEADER  (Zone B)</tspan></text><rect x="540" y="344" width="140" height="42" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="610.0" y="368.675" xml:space="preserve">follower  (Zone C)</tspan></text><path d="M360,365 L380,365" fill="none" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#as)"/><path d="M520,365 L540,365" fill="none" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#as)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold"><tspan x="220" y="422" xml:space="preserve">Range 3  [n – z]  = one Raft/Paxos group of 3 replicas</tspan></text><rect x="220" y="426" width="140" height="42" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="290.0" y="450.675" xml:space="preserve">follower  (Zone A)</tspan></text><rect x="380" y="426" width="140" height="42" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="450.0" y="450.675" xml:space="preserve">follower  (Zone B)</tspan></text><rect x="540" y="426" width="140" height="42" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="610.0" y="450.675" xml:space="preserve">LEADER  (Zone C)</tspan></text><path d="M360,447 L380,447" fill="none" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#as)"/><path d="M520,447 L540,447" fill="none" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#as)"/><path d="M640,234 L640,258" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="220" y="510" width="460" height="36" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="450.0" y="532.025" xml:space="preserve">Per-node storage engine: LSM tree (RocksDB / Pebble)</tspan></text><rect x="710" y="58" width="170" height="488" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#2f9e44" font-weight="bold"><tspan x="722" y="80" xml:space="preserve">What you gain</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="722" y="98" xml:space="preserve">• SQL + ACID</tspan><tspan x="722" y="114" xml:space="preserve">• horizontal write scale</tspan><tspan x="722" y="130" xml:space="preserve">• survives zone/region</tspan><tspan x="722" y="146" xml:space="preserve">  loss, no manual failover</tspan><tspan x="722" y="162" xml:space="preserve">• automatic resharding</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c92a2a" font-weight="bold"><tspan x="722" y="210" xml:space="preserve">What you pay</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="722" y="228" xml:space="preserve">• every commit waits for a</tspan><tspan x="722" y="244" xml:space="preserve">  quorum round trip</tspan><tspan x="722" y="260" xml:space="preserve">  (ms in-region; tens to</tspan><tspan x="722" y="276" xml:space="preserve">  100+ ms cross-region)</tspan><tspan x="722" y="292" xml:space="preserve">• cross-range txns = 2PC</tspan><tspan x="722" y="308" xml:space="preserve">• hot ranges / contention</tspan><tspan x="722" y="324" xml:space="preserve">• cost and ops complexity</tspan><tspan x="722" y="340" xml:space="preserve">• partial Postgres/MySQL</tspan><tspan x="722" y="356" xml:space="preserve">  compatibility</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="722" y="388" xml:space="preserve">Variants</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="722" y="406" xml:space="preserve">Spanner: TrueTime clocks</tspan><tspan x="722" y="422" xml:space="preserve">CockroachDB: HLC, Raft</tspan><tspan x="722" y="438" xml:space="preserve">TiDB: TiKV (Raft) +</tspan><tspan x="722" y="454" xml:space="preserve">  optional TiFlash (HTAP)</tspan><tspan x="722" y="470" xml:space="preserve">Aurora DSQL: OCC +</tspan><tspan x="722" y="486" xml:space="preserve">  snapshot isolation,</tspan><tspan x="722" y="502" xml:space="preserve">  active-active regions</tspan></text><rect x="20" y="566" width="860" height="60" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="588" xml:space="preserve">Compare: one primary + replicas = one writer. Manually sharded SQL (Vitess, Citus) = many writers, but YOU own shard keys, resharding, cross-shard txns.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="606" xml:space="preserve">NewSQL moves that work into the database: each shard is a consensus group, so a node or zone failure is a leader election, not an outage.</tspan></text></svg>