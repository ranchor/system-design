<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">DynamoDB: key → partition → 3 replicas, with async indexes</tspan></text><rect x="20" y="56" width="270" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="270" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">1. Key → partition</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="bold"><tspan x="32" y="106" xml:space="preserve">Item</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="122" xml:space="preserve">PK = user#42     (partition key)</tspan><tspan x="32" y="137" xml:space="preserve">SK = order#2026-11-01   (sort key)</tspan><tspan x="32" y="152" xml:space="preserve">… attributes (≤ 400 KB total)</tspan></text><path d="M155,168 L155,190" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="165" y="184" xml:space="preserve">hash(PK)</tspan></text><rect x="32" y="196" width="56" height="34" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="60.0" y="217.2" xml:space="preserve">P1</tspan></text><rect x="95" y="196" width="56" height="34" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="123.0" y="217.2" xml:space="preserve">P2</tspan></text><rect x="158" y="196" width="56" height="34" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="186.0" y="217.2" xml:space="preserve">P3</tspan></text><rect x="221" y="196" width="56" height="34" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="249.0" y="217.2" xml:space="preserve">P4</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="252" xml:space="preserve">Inside P2: items with the same PK are</tspan><tspan x="32" y="266" xml:space="preserve">stored together, ordered by SK (B-tree).</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="288" xml:space="preserve">user#42 | order#2026-10-02</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="303" xml:space="preserve">user#42 | order#2026-11-01   ← Query:</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="318" xml:space="preserve">user#42 | order#2026-11-09     PK = x AND</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="333" xml:space="preserve">user#57 | order#…            SK BETWEEN …</tspan></text><rect x="310" y="56" width="330" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="310" y="56" width="330" height="28" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="322" y="76" xml:space="preserve">2. Write path (one partition = 3 replicas / 3 AZs)</tspan></text><rect x="330" y="100" width="290" height="34" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="475.0" y="120.675" xml:space="preserve">Client → request router (auth · metadata)</tspan></text><path d="M395,134 L395,160" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="330" y="160" width="130" height="40" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="395.0" y="176.35" xml:space="preserve">LEADER</tspan><tspan x="395.0" y="191.35" xml:space="preserve">storage node · AZ-a</tspan></text><rect x="470" y="160" width="70" height="40" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="505.0" y="176.5" xml:space="preserve">follower</tspan><tspan x="505.0" y="190.5" xml:space="preserve">AZ-b</tspan></text><rect x="550" y="160" width="70" height="40" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="585.0" y="176.5" xml:space="preserve">follower</tspan><tspan x="585.0" y="190.5" xml:space="preserve">AZ-c</tspan></text><path d="M460,172 L470,172" fill="none" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#as)"/><path d="M540,172 L550,172" fill="none" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#ah)" marker-start="url(#as)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="330" y="222" xml:space="preserve">• Leader appends to WAL, ships to followers (Multi-Paxos).</tspan><tspan x="330" y="238" xml:space="preserve">• Ack to client after 2 of 3 replicas have it.</tspan><tspan x="330" y="254" xml:space="preserve">• Strongly consistent read → leader.</tspan><tspan x="330" y="270" xml:space="preserve">• Eventually consistent read → any replica (½ the cost).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="330" y="300" xml:space="preserve">• Leader fails → a follower is elected, partition stays</tspan><tspan x="330" y="316" xml:space="preserve">  available. Hot partitions split automatically.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c92a2a" font-weight="bold"><tspan x="330" y="338" xml:space="preserve">Limits: 3,000 RCU / 1,000 WCU per partition.</tspan></text><rect x="660" y="56" width="220" height="300" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="660" y="56" width="220" height="28" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="672" y="76" xml:space="preserve">3. Derived data</tspan></text><rect x="675" y="100" width="190" height="44" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="770.0" y="118.675" xml:space="preserve">GSI = separate partitioned</tspan><tspan x="770.0" y="132.675" xml:space="preserve">copy with its own key</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="675" y="168" xml:space="preserve">Updated ASYNCHRONOUSLY from the</tspan><tspan x="675" y="184" xml:space="preserve">base table's log →</tspan><tspan x="675" y="200" xml:space="preserve">GSI reads are eventually consistent</tspan><tspan x="675" y="216" xml:space="preserve">only; GSI writes consume WCU too.</tspan></text><rect x="675" y="244" width="190" height="40" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="770.0" y="260.675" xml:space="preserve">Streams (24h change log)</tspan><tspan x="770.0" y="274.675" xml:space="preserve">→ Lambda / Kinesis / CDC</tspan></text><rect x="675" y="296" width="190" height="40" rx="8" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="770.0" y="312.675" xml:space="preserve">Global tables: multi-Region</tspan><tspan x="770.0" y="326.675" xml:space="preserve">MREC (async) or MRSC (strong)</tspan></text><rect x="20" y="376" width="860" height="200" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="400" xml:space="preserve">Capacity &amp; cost mental model</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="422" xml:space="preserve">Read:  1 RCU = one strongly consistent read of up to 4 KB  (eventually consistent = 0.5 RCU, transactional = 2 RCU)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="440" xml:space="preserve">Write: 1 WCU = one write of up to 1 KB  (transactional = 2 WCU). Sizes round up per item.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="462" xml:space="preserve">Modes: on-demand (pay per request, auto-scales) vs provisioned (+ auto scaling, cheaper when steady).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c92a2a" font-weight="normal"><tspan x="34" y="490" xml:space="preserve">Throttling shows up as ProvisionedThroughputExceeded when ONE key / partition runs hot, even if the table has spare capacity overall.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="516" xml:space="preserve">Interview moves:</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="534" xml:space="preserve">(1) pick PK from the main query and make it high-cardinality;  (2) SK for range/ordering;  (3) GSI for each extra access pattern;</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="552" xml:space="preserve">(4) shard hot keys (PK#0..N);  (5) transactions only for small multi-item invariants (≤ 100 items);  (6) DAX / cache for read-heavy hot items.</tspan></text></svg>