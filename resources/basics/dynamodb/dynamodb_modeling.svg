<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">DynamoDB modeling: access patterns → keys → indexes</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" font-weight="normal"><tspan x="20" y="62" xml:space="preserve">Example: an Orders service. List the access patterns first; each one needs a key path (base table or GSI).</tspan></text><rect x="20" y="80" width="520" height="190" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="80" width="520" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="100" xml:space="preserve">Base table: Orders      PK = customerId      SK = createdAt#orderId</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#495057" font-weight="normal"><tspan x="32" y="128" xml:space="preserve">customerId   createdAt#orderId        status     total</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="148" xml:space="preserve">c#42         2026-11-01#o991          SHIPPED    30</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="166" xml:space="preserve">c#42         2026-11-09#o1010         PLACED     55</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="184" xml:space="preserve">c#57         2026-11-03#o998          PLACED     12</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="202" xml:space="preserve">c#57         2026-11-12#o1033         PLACED     81</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="232" xml:space="preserve">AP1  Orders of a customer, newest first  →  Query PK=c#42, ScanIndexForward=false</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="250" xml:space="preserve">AP2  One order by id  →  GSI or store orderId in the key path (or a lookup item)</tspan></text><rect x="560" y="80" width="320" height="190" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="560" y="80" width="320" height="28" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="572" y="100" xml:space="preserve">GSI by status  (AP3: all PLACED orders)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c92a2a" font-weight="bold"><tspan x="572" y="128" xml:space="preserve">Naive:  GSI PK = status</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="572" y="146" xml:space="preserve">Only a handful of values → one</tspan><tspan x="572" y="161" xml:space="preserve">partition takes all the traffic (hot).</tspan></text><rect x="572" y="184" width="296" height="24" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="720.0" y="199.675" xml:space="preserve">PLACED  →  1 partition gets 90% of writes</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="572" y="232" xml:space="preserve">Better: PK = status#shard (0..N), or</tspan><tspan x="572" y="247" xml:space="preserve">status#date; query the shards, merge.</tspan></text><rect x="20" y="290" width="860" height="232" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="314" xml:space="preserve">Patterns worth naming</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1971c2" font-weight="bold"><tspan x="34" y="336" xml:space="preserve">Sparse index</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="34" y="352" xml:space="preserve">Only items that have the GSI key attribute appear in it.</tspan><tspan x="34" y="366" xml:space="preserve">Set `pendingAt` only while an order is pending → the GSI</tspan><tspan x="34" y="380" xml:space="preserve">is a cheap 'work queue'.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1971c2" font-weight="bold"><tspan x="464" y="336" xml:space="preserve">Item collections / single-table</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="464" y="352" xml:space="preserve">Store related entities under one PK (customer + orders) so</tspan><tspan x="464" y="366" xml:space="preserve">one Query returns them. Fast, but rigid; do it only when</tspan><tspan x="464" y="380" xml:space="preserve">access patterns are stable.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1971c2" font-weight="bold"><tspan x="34" y="398" xml:space="preserve">Write sharding</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="34" y="414" xml:space="preserve">Append a suffix (PK#0..N) to spread a hot key; reads fan</tspan><tspan x="34" y="428" xml:space="preserve">out to N keys and merge.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1971c2" font-weight="bold"><tspan x="464" y="398" xml:space="preserve">Optimistic locking</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="464" y="414" xml:space="preserve">ConditionExpression on a `version` attribute: update only</tspan><tspan x="464" y="428" xml:space="preserve">if version = expected. Retry on ConditionalCheckFailed.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1971c2" font-weight="bold"><tspan x="34" y="460" xml:space="preserve">Idempotent writes</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="34" y="476" xml:space="preserve">Put with `attribute_not_exists(PK)` for dedup/claim; or a</tspan><tspan x="34" y="490" xml:space="preserve">client token in a transaction.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1971c2" font-weight="bold"><tspan x="464" y="460" xml:space="preserve">TTL</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="464" y="476" xml:space="preserve">Per-item expiry timestamp; deletes are free (no WCU) but</tspan><tspan x="464" y="490" xml:space="preserve">not instant (typically within days).</tspan></text></svg>