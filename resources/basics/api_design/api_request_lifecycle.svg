<svg xmlns="http://www.w3.org/2000/svg" width="894" height="289" viewBox="0 0 894 289"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">Life of an API request</tspan></text><rect x="20" y="125" width="150" height="70" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="95" y="164">Client</tspan></text><path d="M170,160 L195,160" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="195" y="125" width="150" height="70" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="270" y="164">CDN / WAF</tspan></text><path d="M345,160 L370,160" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="370" y="125" width="150" height="70" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="445" y="156">API gateway</tspan><tspan x="445" y="172">authN, rate limit</tspan></text><path d="M520,160 L545,160" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="545" y="125" width="150" height="70" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="620" y="148">Service</tspan><tspan x="620" y="164">validate, authZ,</tspan><tspan x="620" y="180">idempotency</tspan></text><path d="M695,160 L720,160" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><path d="M720,132 L720,188 A75.0,12 0 0 0 870,188 L870,132" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><ellipse cx="795.0" cy="132" rx="75.0" ry="12" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="795" y="171">DB / cache</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057"><tspan x="20" y="243">Response: status code + JSON body + headers (ETag, X-RateLimit-Remaining, request_id)</tspan><tspan x="20" y="261">Errors: { code, message, request_id }; pagination via next_cursor; writes carry Idempotency-Key</tspan></text></svg>