<svg xmlns="http://www.w3.org/2000/svg" width="900" height="580" viewBox="0 0 900 580"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">MongoDB: replica sets for HA, sharding for scale</tspan></text><rect x="20" y="56" width="300" height="330" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="300" height="28" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">Replica set (one shard)</tspan></text><rect x="100" y="100" width="140" height="52" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="170.0" y="122.35" xml:space="preserve">PRIMARY</tspan><tspan x="170.0" y="137.35" xml:space="preserve">all writes · oplog</tspan></text><rect x="34" y="220" width="120" height="46" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="94.0" y="239.675" xml:space="preserve">SECONDARY</tspan><tspan x="94.0" y="253.675" xml:space="preserve">applies oplog</tspan></text><rect x="186" y="220" width="120" height="46" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="246.0" y="239.675" xml:space="preserve">SECONDARY</tspan><tspan x="246.0" y="253.675" xml:space="preserve">applies oplog</tspan></text><path d="M150,152 L100,220" fill="none" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#ah)"/><path d="M190,152 L240,220" fill="none" stroke="#adb5bd" stroke-width="1.5" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="32" y="296" xml:space="preserve">• Secondaries tail the primary's oplog (async by default).</tspan><tspan x="32" y="311" xml:space="preserve">• Primary down → election (Raft-like, majority) in ~seconds.</tspan><tspan x="32" y="326" xml:space="preserve">• writeConcern: w:'majority' → survives failover.</tspan><tspan x="32" y="341" xml:space="preserve">• readConcern / readPreference choose staleness.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="366" xml:space="preserve">Storage: WiredTiger (B-tree, MVCC, compression).</tspan></text><rect x="340" y="56" width="540" height="330" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="340" y="56" width="540" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="352" y="76" xml:space="preserve">Sharded cluster</tspan></text><rect x="360" y="96" width="500" height="28" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="610.0" y="113.85" xml:space="preserve">Applications / drivers</tspan></text><rect x="370" y="142" width="160" height="36" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="450.0" y="163.85" xml:space="preserve">mongos (query router)</tspan></text><path d="M450,124 L450,142" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="550" y="142" width="160" height="36" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="630.0" y="163.85" xml:space="preserve">mongos (query router)</tspan></text><path d="M630,124 L630,142" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="740" y="138" width="130" height="44" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="805.0" y="156.5" xml:space="preserve">config servers (RS)</tspan><tspan x="805.0" y="170.5" xml:space="preserve">chunk map</tspan></text><path d="M710,160 L740,160" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/><rect x="360" y="218" width="160" height="120" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="440" y="238" xml:space="preserve">Shard 1  (replica set)</tspan></text><rect x="370" y="248" width="140" height="24" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="440.0" y="263.5" xml:space="preserve">primary</tspan></text><rect x="370" y="278" width="66" height="22" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="403.0" y="292.325" xml:space="preserve">sec.</tspan></text><rect x="444" y="278" width="66" height="22" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="477.0" y="292.325" xml:space="preserve">sec.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="440" y="322" xml:space="preserve">chunks A–F</tspan></text><path d="M450,178 L440,218" fill="none" stroke="#adb5bd" stroke-width="1.2" marker-end="url(#ah)"/><rect x="530" y="218" width="160" height="120" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="610" y="238" xml:space="preserve">Shard 2  (replica set)</tspan></text><rect x="540" y="248" width="140" height="24" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="610.0" y="263.5" xml:space="preserve">primary</tspan></text><rect x="540" y="278" width="66" height="22" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="573.0" y="292.325" xml:space="preserve">sec.</tspan></text><rect x="614" y="278" width="66" height="22" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="647.0" y="292.325" xml:space="preserve">sec.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="610" y="322" xml:space="preserve">chunks G–M</tspan></text><path d="M450,178 L610,218" fill="none" stroke="#adb5bd" stroke-width="1.2" marker-end="url(#ah)"/><rect x="700" y="218" width="160" height="120" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="780" y="238" xml:space="preserve">Shard 3  (replica set)</tspan></text><rect x="710" y="248" width="140" height="24" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="780.0" y="263.5" xml:space="preserve">primary</tspan></text><rect x="710" y="278" width="66" height="22" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="743.0" y="292.325" xml:space="preserve">sec.</tspan></text><rect x="784" y="278" width="66" height="22" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="817.0" y="292.325" xml:space="preserve">sec.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="780" y="322" xml:space="preserve">chunks N–Z</tspan></text><path d="M450,178 L780,218" fill="none" stroke="#adb5bd" stroke-width="1.2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="352" y="366" xml:space="preserve">mongos routes by shard key: targeted if the filter has it, else scatter-gather. Balancer moves chunks.</tspan></text><rect x="20" y="406" width="860" height="154" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="430" xml:space="preserve">Shard key = the big decision (hard to change; reshardCollection exists but is heavy)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="452" xml:space="preserve">Hashed key (e.g. hash(userId)): even spread, great for point lookups; range queries become scatter-gather.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="470" xml:space="preserve">Ranged key (e.g. tenantId, createdAt): range queries stay targeted; monotonic keys (ObjectId, timestamp) pile all inserts on the last chunk (hot shard).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="488" xml:space="preserve">Compound key (tenantId, hash(userId)): keeps a tenant's data close and spreads big tenants. Good keys: high cardinality, low frequency, non-monotonic.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c92a2a" font-weight="bold"><tspan x="34" y="516" xml:space="preserve">Always: include the shard key in hot queries; prefer embedding for read-together data; cap array growth; majority write concern for data you can't lose.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="538" xml:space="preserve">Transactions: multi-document ACID across shards via 2PC (slower, size/time bounded). Design so hot paths touch one document or one shard.</tspan></text></svg>