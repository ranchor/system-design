<svg xmlns="http://www.w3.org/2000/svg" width="940" height="395" viewBox="0 0 940 395"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Pick the data model from the access pattern (default: relational)</tspan></text><rect x="20" y="60" width="230" height="46" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="135.0" y="87.2" xml:space="preserve">Relational (Postgres)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal"><tspan x="270" y="80" xml:space="preserve">Default. Entities with relationships, ACID, ad-hoc queries.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" font-style="italic"><tspan x="270" y="98" xml:space="preserve">e.g. users, orders, payments, inventory</tspan></text><rect x="20" y="118" width="230" height="46" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="135.0" y="145.2" xml:space="preserve">Document (Mongo)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal"><tspan x="270" y="138" xml:space="preserve">Aggregate read as a whole, evolving or varied shape.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" font-style="italic"><tspan x="270" y="156" xml:space="preserve">e.g. catalog, profiles, CMS</tspan></text><rect x="20" y="176" width="230" height="46" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="135.0" y="203.2" xml:space="preserve">Key-value (Redis/Dynamo)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal"><tspan x="270" y="196" xml:space="preserve">Lookup by one key, huge scale, or cache in front of SQL.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" font-style="italic"><tspan x="270" y="214" xml:space="preserve">e.g. sessions, flags, carts, cache</tspan></text><rect x="20" y="234" width="230" height="46" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="135.0" y="261.2" xml:space="preserve">Wide-column (Cassandra)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal"><tspan x="270" y="254" xml:space="preserve">Massive append-heavy writes keyed by (partition, time).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" font-style="italic"><tspan x="270" y="272" xml:space="preserve">e.g. events, metrics, messages</tspan></text><rect x="20" y="292" width="230" height="46" rx="8" fill="#eebefa" stroke="#9c36b5" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="135.0" y="319.2" xml:space="preserve">Graph (Neo4j)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="normal"><tspan x="270" y="312" xml:space="preserve">Variable-depth traversals. Rare; even Facebook uses MySQL.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" font-style="italic"><tspan x="270" y="330" xml:space="preserve">e.g. fraud rings, knowledge graph</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="20" y="382" xml:space="preserve">Most systems end up polyglot: one relational source of truth + derived stores (cache, search, analytics) fed by CDC.</tspan></text></svg>