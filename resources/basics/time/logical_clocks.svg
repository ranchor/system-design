<svg xmlns="http://www.w3.org/2000/svg" width="940" height="420" viewBox="0 0 940 420"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Logical clocks: Lamport orders events, vector clocks detect concurrency</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="104" xml:space="preserve">Node A</tspan></text><path d="M100,100 L900,100" fill="none" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="204" xml:space="preserve">Node B</tspan></text><path d="M100,200 L900,200" fill="none" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="304" xml:space="preserve">Node C</tspan></text><path d="M100,300 L900,300" fill="none" stroke="#adb5bd" stroke-width="2"/><circle cx="160" cy="100" r="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="160" y="104" xml:space="preserve">a1</tspan></text><circle cx="420" cy="100" r="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="420" y="104" xml:space="preserve">a2</tspan></text><circle cx="700" cy="100" r="12" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="700" y="104" xml:space="preserve">a3</tspan></text><circle cx="280" cy="200" r="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="280" y="204" xml:space="preserve">b1</tspan></text><circle cx="560" cy="200" r="12" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="560" y="204" xml:space="preserve">b2</tspan></text><circle cx="220" cy="300" r="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="220" y="304" xml:space="preserve">c1</tspan></text><circle cx="620" cy="300" r="12" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="620" y="304" xml:space="preserve">c2</tspan></text><path d="M166,110 L274,192" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ah)"/><path d="M428,110 L554,192" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ah)"/><path d="M566,210 L614,292" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="100" y="340" xml:space="preserve">Lamport: L = max(local, received) + 1 → if a→b then L(a) &lt; L(b), but L(a) &lt; L(b) does NOT imply a→b.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="100" y="362" xml:space="preserve">Vector clock: one counter per node, e.g. [A2,B0,C0] vs [A1,B1,C0] are concurrent (neither dominates).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="100" y="384" xml:space="preserve">Hybrid logical clock (HLC): physical time + logical counter → readable timestamps with causal order (CockroachDB, MongoDB).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="100" y="56" xml:space="preserve">Red arrows = messages. a1 → b1 (happens-before); a2 and c1 have no path between them: concurrent.</tspan></text></svg>