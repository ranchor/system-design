<svg xmlns="http://www.w3.org/2000/svg" width="869" height="295" viewBox="0 0 869 295"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#495057"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#495057"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">Consistency spectrum (replicated data)</tspan></text><path d="M40,110 L820,110" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#2b8a3e"><tspan x="30" y="83">stronger: easier to reason about</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#c92a2a"><tspan x="560" y="83">weaker: lower latency, more available</tspan></text><rect x="30" y="140" width="150" height="64" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="105" y="177">Linearizable</tspan></text><rect x="195" y="140" width="150" height="64" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="270" y="177">Sequential</tspan></text><rect x="360" y="140" width="150" height="64" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="435" y="177">Causal</tspan></text><rect x="525" y="140" width="150" height="64" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="600" y="168">Session</tspan><tspan x="600" y="186">(RYW, monotonic)</tspan></text><rect x="690" y="140" width="150" height="64" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="765" y="177">Eventual</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="30" y="234">consensus /</tspan><tspan x="30" y="251">sync replication</tspan><tspan x="30" y="267">(etcd, Spanner)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="195" y="234">total-order</tspan><tspan x="195" y="251">broadcast</tspan><tspan x="195" y="267">(ZooKeeper reads)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="360" y="234">vector clocks,</tspan><tspan x="360" y="251">dependency tracking</tspan><tspan x="360" y="267">(COPS)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="525" y="234">sticky replica,</tspan><tspan x="525" y="251">version tokens</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="690" y="234">async replication,</tspan><tspan x="690" y="251">anti-entropy</tspan><tspan x="690" y="267">(DNS, Cassandra ONE)</tspan></text></svg>