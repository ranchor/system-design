<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">PostgreSQL vs MySQL (InnoDB): where the internals differ</tspan></text><rect x="20" y="56" width="420" height="330" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="420" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">PostgreSQL</tspan></text><rect x="460" y="56" width="420" height="330" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="460" y="56" width="420" height="28" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="472" y="76" xml:space="preserve">MySQL / InnoDB</tspan></text><rect x="34" y="98" width="392" height="40" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="230.0" y="121.675" xml:space="preserve">Heap table: unordered pages of row versions (tuples: xmin / xmax)</tspan></text><rect x="34" y="150" width="190" height="36" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="129.0" y="164.5" xml:space="preserve">B-tree index on PK</tspan><tspan x="129.0" y="178.5" xml:space="preserve">leaf → (page, offset) = ctid</tspan></text><rect x="236" y="150" width="190" height="36" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="331.0" y="164.5" xml:space="preserve">Secondary indexes</tspan><tspan x="331.0" y="178.5" xml:space="preserve">leaf → ctid (same shape)</tspan></text><path d="M129,150 L129,138" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M331,150 L331,138" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="34" y="212" xml:space="preserve">• UPDATE writes a NEW tuple version in the heap;</tspan><tspan x="34" y="227" xml:space="preserve">  old one stays until VACUUM removes it (bloat risk).</tspan><tspan x="34" y="242" xml:space="preserve">• HOT update: no index change if no indexed column</tspan><tspan x="34" y="257" xml:space="preserve">  changed and the page has room.</tspan><tspan x="34" y="272" xml:space="preserve">• Replication: WAL shipped physically (streaming) or</tspan><tspan x="34" y="287" xml:space="preserve">  logically (publications) → replicas, Debezium.</tspan><tspan x="34" y="302" xml:space="preserve">• Process per connection → use PgBouncer.</tspan><tspan x="34" y="317" xml:space="preserve">• Extensions: PostGIS, pgvector, Citus, TimescaleDB.</tspan></text><rect x="474" y="98" width="392" height="40" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="670.0" y="121.675" xml:space="preserve">Clustered B+tree on the PRIMARY KEY: leaf pages hold the rows</tspan></text><rect x="474" y="150" width="190" height="36" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="569.0" y="164.5" xml:space="preserve">Secondary index</tspan><tspan x="569.0" y="178.5" xml:space="preserve">leaf → PRIMARY KEY value</tspan></text><rect x="676" y="150" width="190" height="36" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="771.0" y="164.5" xml:space="preserve">Undo log (old versions)</tspan><tspan x="771.0" y="178.5" xml:space="preserve">+ redo log (durability)</tspan></text><path d="M569,150 L569,138" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M771,150 L771,138" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="474" y="212" xml:space="preserve">• PK lookups are fast; secondary lookups do 2 steps</tspan><tspan x="474" y="227" xml:space="preserve">  (index → PK → row). Big PKs bloat every index.</tspan><tspan x="474" y="242" xml:space="preserve">• UPDATE modifies in place; old versions in undo,</tspan><tspan x="474" y="257" xml:space="preserve">  purged in background. Less table bloat.</tspan><tspan x="474" y="272" xml:space="preserve">• Replication: logical binlog (statement / row);</tspan><tspan x="474" y="287" xml:space="preserve">  semi-sync, Group Replication; Vitess for sharding.</tspan><tspan x="474" y="302" xml:space="preserve">• Thread per connection (still pool them).</tspan><tspan x="474" y="317" xml:space="preserve">• Online DDL (INSTANT / INPLACE), mature tooling.</tspan></text><rect x="20" y="406" width="860" height="176" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="430" xml:space="preserve">Quick comparison</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e8590c" font-weight="bold"><tspan x="34" y="450" xml:space="preserve"></tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1971c2" font-weight="bold"><tspan x="170" y="450" xml:space="preserve">PostgreSQL</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#e8590c" font-weight="bold"><tspan x="520" y="450" xml:space="preserve">MySQL (InnoDB)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="470" xml:space="preserve">Default isolation</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="170" y="470" xml:space="preserve">Read Committed (SSI for Serializable)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="520" y="470" xml:space="preserve">Repeatable Read (gap/next-key locks)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="491" xml:space="preserve">Rich features</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="170" y="491" xml:space="preserve">jsonb, GIN/GiST/BRIN, partial &amp; expression indexes</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="520" y="491" xml:space="preserve">Simpler; JSON, CTEs and window functions maturing</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="512" xml:space="preserve">Scaling story</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="170" y="512" xml:space="preserve">Replicas, partitioning, Citus</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="520" y="512" xml:space="preserve">Replicas, Vitess (YouTube, Slack), Group Replication</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="533" xml:space="preserve">Typical pick</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="170" y="533" xml:space="preserve">Default for new systems, complex queries, extensions</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="520" y="533" xml:space="preserve">Simple OLTP at huge scale; mature sharding tooling</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="554" xml:space="preserve">Watch out</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="170" y="554" xml:space="preserve">Bloat / autovacuum, XID wraparound, connection count</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="520" y="554" xml:space="preserve">PK choice (random UUID PKs fragment), replica lag, gap locks</tspan></text></svg>