<svg xmlns="http://www.w3.org/2000/svg" width="854" height="444" viewBox="0 0 854 444"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">B+ tree vs LSM tree write paths</tspan></text><rect x="20" y="60" width="360" height="360" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2" font-weight="bold"><tspan x="30" y="80">B+ tree (update in place)</tspan></text><rect x="150" y="100" width="100" height="45" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="200" y="128">root</tspan></text><rect x="60" y="185" width="100" height="45" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="110" y="213">internal</tspan></text><rect x="240" y="185" width="100" height="45" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="290" y="213">internal</tspan></text><path d="M180,145 L110,185" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><path d="M220,145 L290,185" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="40" y="275" width="72" height="45" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="76" y="302">leaf 1</tspan></text><rect x="122" y="275" width="72" height="45" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="158" y="302">leaf 2</tspan></text><rect x="204" y="275" width="72" height="45" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="240" y="302">leaf 3</tspan></text><rect x="286" y="275" width="72" height="45" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="322" y="302">leaf 4</tspan></text><path d="M110,230 L76,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><path d="M110,230 L158,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><path d="M290,230 L240,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><path d="M290,230 L322,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="40" y="352">write: WAL append + find page,</tspan><tspan x="40" y="369">modify in place (random I/O)</tspan><tspan x="40" y="385">read: one root-to-leaf walk</tspan></text><rect x="400" y="60" width="430" height="360" rx="12" fill="#f3f0ff" stroke="#6741d9" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#6741d9" font-weight="bold"><tspan x="410" y="80">LSM tree (append + compact)</tspan></text><rect x="420" y="100" width="130" height="55" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="485" y="124">write -&gt;</tspan><tspan x="485" y="140">WAL + memtable</tspan></text><path d="M550,127 L600,127" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="551.4" y="116.25" width="47.2" height="21.5" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#343a40" text-anchor="middle"><tspan x="575" y="132">flush</tspan></text><rect x="600" y="100" width="210" height="55" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="705" y="132">L0: SSTable SSTable SSTable</tspan></text><path d="M705,155 L705,195" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="677.48" y="165.5" width="55.040000000000006" height="19.0" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#343a40" text-anchor="middle"><tspan x="705" y="179">compact</tspan></text><rect x="600" y="195" width="210" height="50" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="705" y="224">L1: larger sorted SSTables</tspan></text><path d="M705,245 L705,280" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="600" y="280" width="210" height="50" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" text-anchor="middle"><tspan x="705" y="309">L2: ...</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="420" y="202">read: memtable,</tspan><tspan x="420" y="219">then L0 -&gt; L1 -&gt; L2</tspan><tspan x="420" y="235">(Bloom filter per</tspan><tspan x="420" y="251">SSTable skips files)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="420" y="357">sequential writes = high ingest;</tspan><tspan x="420" y="374">cost = compaction + read amplification</tspan></text></svg>