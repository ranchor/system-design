<svg xmlns="http://www.w3.org/2000/svg" width="900" height="610" viewBox="0 0 900 610"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">NoSQL is not one thing: four core data models</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057" font-weight="normal"><tspan x="20" y="58" xml:space="preserve">Pick the family from the access pattern. Specialised stores (bottom) are often lumped in, but serve different needs.</tspan></text><rect x="20" y="80" width="207" height="52" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="123.5" y="102" xml:space="preserve">Key-value</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="123.5" y="120" xml:space="preserve">hash table: key → opaque value</tspan></text><rect x="20" y="140" width="207" height="128" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9.5" fill="#495057" font-weight="normal"><tspan x="30" y="160" xml:space="preserve">KEY          VALUE (opaque)</tspan></text><rect x="30" y="170" width="62" height="22" rx="4" fill="#ffc9c9" stroke="#e03131" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="61" y="185" xml:space="preserve">user:42</tspan></text><rect x="96" y="170" width="122" height="22" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal"><tspan x="102" y="185" xml:space="preserve">{name:"Ana"}</tspan></text><rect x="30" y="198" width="62" height="22" rx="4" fill="#ffc9c9" stroke="#e03131" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="61" y="213" xml:space="preserve">sess:9f2</tspan></text><rect x="96" y="198" width="122" height="22" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal"><tspan x="102" y="213" xml:space="preserve">{uid:42,ttl:30m}</tspan></text><rect x="30" y="226" width="62" height="22" rx="4" fill="#ffc9c9" stroke="#e03131" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="61" y="241" xml:space="preserve">cart:7</tspan></text><rect x="96" y="226" width="122" height="22" rx="4" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal"><tspan x="102" y="241" xml:space="preserve">[sku1, sku9]</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#495057" font-weight="normal" font-style="italic"><tspan x="30" y="262" xml:space="preserve">O(1) lookup, hash-partitioned</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#e03131" font-weight="bold"><tspan x="20" y="286" xml:space="preserve">Redis · DynamoDB · Riak · etcd</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="306" xml:space="preserve">Query model</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="321" xml:space="preserve">get / put / delete by key.</tspan><tspan x="20" y="336" xml:space="preserve">DynamoDB adds a sort key and</tspan><tspan x="20" y="351" xml:space="preserve">secondary indexes.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="372" xml:space="preserve">Best for</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="387" xml:space="preserve">Sessions, carts, counters, flags,</tspan><tspan x="20" y="402" xml:space="preserve">cache, id → metadata lookups.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c92a2a" font-weight="bold"><tspan x="20" y="423" xml:space="preserve">Watch out</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="438" xml:space="preserve">No ad-hoc queries, hot keys, value</tspan><tspan x="20" y="453" xml:space="preserve">is opaque to the DB.</tspan></text><rect x="239" y="80" width="207" height="52" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="342.5" y="102" xml:space="preserve">Document</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="342.5" y="120" xml:space="preserve">key → JSON document (indexable)</tspan></text><rect x="239" y="140" width="207" height="128" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal"><tspan x="251" y="160" xml:space="preserve">{ "_id": 42,</tspan><tspan x="251" y="174" xml:space="preserve">  "name": "Ana",</tspan><tspan x="251" y="188" xml:space="preserve">  "addr": { "city": "SEA" },</tspan><tspan x="251" y="202" xml:space="preserve">  "orders": [</tspan><tspan x="251" y="216" xml:space="preserve">    { "id": 101, "total": 30 },</tspan><tspan x="251" y="230" xml:space="preserve">    { "id": 102, "total": 55 } ],</tspan><tspan x="251" y="244" xml:space="preserve">  "tags": ["vip"] }</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#f08c00" font-weight="bold"><tspan x="239" y="286" xml:space="preserve">MongoDB · Couchbase · Firestore</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="239" y="306" xml:space="preserve">Query model</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="239" y="321" xml:space="preserve">By id, secondary indexes, filters</tspan><tspan x="239" y="336" xml:space="preserve">and aggregation inside documents.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="239" y="357" xml:space="preserve">Best for</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="239" y="372" xml:space="preserve">Catalogs, profiles, CMS: read the</tspan><tspan x="239" y="387" xml:space="preserve">whole entity in one hit.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c92a2a" font-weight="bold"><tspan x="239" y="408" xml:space="preserve">Watch out</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="239" y="423" xml:space="preserve">Unbounded arrays, doc size limits,</tspan><tspan x="239" y="438" xml:space="preserve">duplicated data, costly cross-</tspan><tspan x="239" y="453" xml:space="preserve">document transactions.</tspan></text><rect x="458" y="80" width="207" height="52" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="561.5" y="102" xml:space="preserve">Wide-column</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="561.5" y="120" xml:space="preserve">partition key → sorted rows</tspan></text><rect x="458" y="140" width="207" height="128" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#495057" font-weight="normal"><tspan x="468" y="158" xml:space="preserve">PARTITION  CLUSTER  COLUMNS</tspan></text><rect x="468" y="164" width="62" height="19" rx="3" fill="#d0bfff" stroke="#6741d9" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="499" y="178" xml:space="preserve">chat#7</tspan></text><rect x="532" y="164" width="28" height="20" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="546" y="178" xml:space="preserve">t1</tspan></text><rect x="562" y="164" width="94" height="20" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal"><tspan x="567" y="178" xml:space="preserve">msg, from</tspan></text><rect x="468" y="186" width="62" height="19" rx="3" fill="#d0bfff" stroke="#6741d9" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="499" y="200" xml:space="preserve">chat#7</tspan></text><rect x="532" y="186" width="28" height="20" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="546" y="200" xml:space="preserve">t2</tspan></text><rect x="562" y="186" width="94" height="20" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal"><tspan x="567" y="200" xml:space="preserve">msg, from</tspan></text><rect x="468" y="208" width="62" height="19" rx="3" fill="#d0bfff" stroke="#6741d9" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="499" y="222" xml:space="preserve">chat#7</tspan></text><rect x="532" y="208" width="28" height="20" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="546" y="222" xml:space="preserve">t3</tspan></text><rect x="562" y="208" width="94" height="20" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal"><tspan x="567" y="222" xml:space="preserve">msg, from</tspan></text><rect x="468" y="230" width="62" height="19" rx="3" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="499" y="244" xml:space="preserve">chat#8</tspan></text><rect x="532" y="230" width="28" height="20" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="546" y="244" xml:space="preserve">t1</tspan></text><rect x="562" y="230" width="94" height="20" rx="3" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="9" fill="#1e1e1e" font-weight="normal"><tspan x="567" y="244" xml:space="preserve">msg, from</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#495057" font-weight="normal" font-style="italic"><tspan x="468" y="263" xml:space="preserve">same partition = stored together, sorted</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#6741d9" font-weight="bold"><tspan x="458" y="286" xml:space="preserve">Cassandra · ScyllaDB · HBase · Bigtable</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="458" y="306" xml:space="preserve">Query model</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="458" y="321" xml:space="preserve">Partition key + clustering-key</tspan><tspan x="458" y="336" xml:space="preserve">range. No joins; model one table</tspan><tspan x="458" y="351" xml:space="preserve">per query.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="458" y="372" xml:space="preserve">Best for</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="458" y="387" xml:space="preserve">Chat messages, event logs, feeds,</tspan><tspan x="458" y="402" xml:space="preserve">IoT: heavy writes, time-ordered</tspan><tspan x="458" y="417" xml:space="preserve">reads.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c92a2a" font-weight="bold"><tspan x="458" y="438" xml:space="preserve">Watch out</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="458" y="453" xml:space="preserve">Huge or hot partitions,</tspan><tspan x="458" y="468" xml:space="preserve">tombstones, weak secondary</tspan><tspan x="458" y="483" xml:space="preserve">indexes.</tspan></text><rect x="677" y="80" width="207" height="52" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="780.5" y="102" xml:space="preserve">Graph</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="780.5" y="120" xml:space="preserve">nodes + edges + properties</tspan></text><rect x="677" y="140" width="207" height="128" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><path d="M722,200 L782,165" fill="none" stroke="#0c8599" stroke-width="2"/><path d="M722,200 L782,235" fill="none" stroke="#0c8599" stroke-width="2"/><path d="M782,165 L842,200" fill="none" stroke="#0c8599" stroke-width="2"/><path d="M782,235 L842,200" fill="none" stroke="#0c8599" stroke-width="2"/><circle cx="722" cy="200" r="17" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="722" y="204" xml:space="preserve">Ana</tspan></text><circle cx="782" cy="165" r="17" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="782" y="169" xml:space="preserve">Bo</tspan></text><circle cx="782" cy="235" r="17" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="782" y="239" xml:space="preserve">Cy</tspan></text><circle cx="842" cy="200" r="17" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="842" y="204" xml:space="preserve">Dee</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#495057" font-weight="normal" font-style="italic"><tspan x="687" y="262" xml:space="preserve">hop along edges, not joins</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#0c8599" font-weight="bold"><tspan x="677" y="286" xml:space="preserve">Neo4j · Neptune · JanusGraph · TigerGraph</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="677" y="306" xml:space="preserve">Query model</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="677" y="321" xml:space="preserve">Traversals and pattern matching</tspan><tspan x="677" y="336" xml:space="preserve">(Cypher, Gremlin, SPARQL).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="677" y="357" xml:space="preserve">Best for</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="677" y="372" xml:space="preserve">Fraud rings, knowledge graphs,</tspan><tspan x="677" y="387" xml:space="preserve">recommendations, identity</tspan><tspan x="677" y="402" xml:space="preserve">resolution.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c92a2a" font-weight="bold"><tspan x="677" y="423" xml:space="preserve">Watch out</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="677" y="438" xml:space="preserve">Super-nodes, hard to shard, small</tspan><tspan x="677" y="453" xml:space="preserve">ecosystem; often unnecessary.</tspan></text><rect x="20" y="516" width="860" height="80" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="536" xml:space="preserve">Specialised stores (separate access patterns, usually fed from the source of truth)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="558" xml:space="preserve">Search: Elasticsearch, OpenSearch</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="247" y="558" xml:space="preserve">Time-series: Prometheus, Timescale</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="462" y="558" xml:space="preserve">Vector: pgvector, Pinecone</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="677" y="558" xml:space="preserve">Columnar OLAP: ClickHouse, BigQuery</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#c92a2a" font-weight="normal" font-style="italic"><tspan x="32" y="582" xml:space="preserve">Careful: wide-column (Cassandra) ≠ columnar (ClickHouse). Wide-column groups rows by partition key; columnar lays out each column contiguously for scans.</tspan></text></svg>