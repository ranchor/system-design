<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600" viewBox="0 0 900 600"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">The same data (customer Ana + 2 orders) in five models</tspan></text><rect x="20" y="56" width="282" height="236" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="282" height="30" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="77" xml:space="preserve">Relational</tspan></text><rect x="309" y="56" width="282" height="236" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="309" y="56" width="282" height="30" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="321" y="77" xml:space="preserve">Document</tspan></text><rect x="598" y="56" width="282" height="236" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="598" y="56" width="282" height="30" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="610" y="77" xml:space="preserve">Key-value</tspan></text><rect x="20" y="306" width="282" height="236" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="306" width="282" height="30" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="327" xml:space="preserve">Wide-column</tspan></text><rect x="309" y="306" width="282" height="236" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="309" y="306" width="282" height="30" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="321" y="327" xml:space="preserve">Graph</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="bold"><tspan x="32" y="108" xml:space="preserve">users</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="124" xml:space="preserve">id | name</tspan><tspan x="32" y="139" xml:space="preserve">42 | Ana</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="bold"><tspan x="32" y="164" xml:space="preserve">orders</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="180" xml:space="preserve">id  | user_id | total</tspan><tspan x="32" y="195" xml:space="preserve">101 | 42      | 30</tspan><tspan x="32" y="210" xml:space="preserve">102 | 42      | 55</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="242" xml:space="preserve">Join on user_id; FK keeps it valid.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="258" xml:space="preserve">Normalized: each fact stored once.</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="321" y="108" xml:space="preserve">{ "_id": 42, "name": "Ana",</tspan><tspan x="321" y="123" xml:space="preserve">  "orders": [</tspan><tspan x="321" y="138" xml:space="preserve">    { "id": 101, "total": 30 },</tspan><tspan x="321" y="153" xml:space="preserve">    { "id": 102, "total": 55 }</tspan><tspan x="321" y="168" xml:space="preserve">  ] }</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="321" y="206" xml:space="preserve">One read returns the whole entity.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="321" y="222" xml:space="preserve">Denormalized: orders embedded.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="321" y="238" xml:space="preserve">Querying orders across customers is</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="321" y="254" xml:space="preserve">harder (index inside arrays).</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="610" y="108" xml:space="preserve">user:42    → {name:'Ana'}</tspan><tspan x="610" y="126" xml:space="preserve">orders:42  → [101, 102]</tspan><tspan x="610" y="144" xml:space="preserve">order:101  → {total:30}</tspan><tspan x="610" y="162" xml:space="preserve">order:102  → {total:55}</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="610" y="196" xml:space="preserve">Values are opaque blobs.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="610" y="212" xml:space="preserve">App does the stitching (N+1 gets).</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="610" y="228" xml:space="preserve">Fastest, but you can only ask for</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="610" y="244" xml:space="preserve">what you know the key of.</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#495057" font-weight="normal"><tspan x="32" y="358" xml:space="preserve">PK(user_id) CK(order_id) | total</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10" fill="#1e1e1e" font-weight="normal"><tspan x="32" y="376" xml:space="preserve">42          101          | 30</tspan><tspan x="32" y="392" xml:space="preserve">42          102          | 55</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="424" xml:space="preserve">Table designed for ONE query:</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="440" xml:space="preserve">'orders of user 42, newest first'.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="462" xml:space="preserve">Rows of a partition live together,</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="478" xml:space="preserve">sorted by the clustering key.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="32" y="498" xml:space="preserve">Another query = another table.</tspan></text><path d="M375,398 L421,380" fill="none" stroke="#0c8599" stroke-width="2" marker-end="url(#ah)"/><path d="M375,414 L421,442" fill="none" stroke="#0c8599" stroke-width="2" marker-end="url(#ah)"/><path d="M477,376 L523,376" fill="none" stroke="#0c8599" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#495057" font-weight="normal"><tspan x="371" y="382" xml:space="preserve">PLACED</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="8.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="497" y="362" xml:space="preserve">CONTAINS</tspan></text><rect x="323" y="392" width="56" height="28" rx="14" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="351" y="410" xml:space="preserve">Ana</tspan></text><rect x="421" y="362" width="56" height="28" rx="14" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="449" y="380" xml:space="preserve">Order101</tspan></text><rect x="421" y="432" width="56" height="28" rx="14" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="449" y="450" xml:space="preserve">Order102</tspan></text><rect x="517" y="362" width="56" height="28" rx="14" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="9.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="545" y="380" xml:space="preserve">Book</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="321" y="496" xml:space="preserve">Relationships are first-class.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="321" y="512" xml:space="preserve">Shines when queries are multi-hop.</tspan></text><rect x="598" y="306" width="282" height="236" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="612" y="334" xml:space="preserve">How to choose in the interview</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="612" y="360" xml:space="preserve">1. List the queries first (by id? by</tspan><tspan x="612" y="377" xml:space="preserve">    range? joins? traversals?).</tspan><tspan x="612" y="394" xml:space="preserve">2. Pick the model whose natural</tspan><tspan x="612" y="411" xml:space="preserve">    layout answers them in one hop.</tspan><tspan x="612" y="428" xml:space="preserve">3. Normalize if you must join and</tspan><tspan x="612" y="445" xml:space="preserve">    keep invariants; denormalize if</tspan><tspan x="612" y="462" xml:space="preserve">    you read whole entities together.</tspan></text></svg>