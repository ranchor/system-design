<svg xmlns="http://www.w3.org/2000/svg" width="864" height="514" viewBox="0 0 864 514"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#adb5bd"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#adb5bd"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">Choosing a datastore by access pattern</tspan></text><rect x="300" y="60" width="240" height="60" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="420" y="86">What is the dominant</tspan><tspan x="420" y="104">access pattern?</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="25" y="192">Transactions, joins,</tspan><tspan x="25" y="209">invariants</tspan></text><rect x="20" y="225" width="190" height="65" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="115" y="253">Relational / NewSQL</tspan><tspan x="115" y="271">Postgres, Spanner</tspan></text><path d="M420,120 L115,176" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="235" y="192">Lookup by key,</tspan><tspan x="235" y="209">huge scale</tspan></text><rect x="230" y="225" width="190" height="65" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="325" y="253">Key-value</tspan><tspan x="325" y="271">Redis, DynamoDB</tspan></text><path d="M420,120 L325,176" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="445" y="192">Write-heavy,</tspan><tspan x="445" y="209">time-ordered</tspan></text><rect x="440" y="225" width="190" height="65" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="535" y="253">Wide-column</tspan><tspan x="535" y="271">Cassandra, Bigtable</tspan></text><path d="M420,120 L535,176" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="655" y="192">Flexible nested</tspan><tspan x="655" y="209">entities</tspan></text><rect x="650" y="225" width="190" height="65" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="745" y="253">Document</tspan><tspan x="745" y="271">MongoDB</tspan></text><path d="M420,120 L745,176" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="25" y="392">Multi-hop</tspan><tspan x="25" y="409">relationships</tspan></text><rect x="20" y="425" width="190" height="65" rx="10" fill="#eebefa" stroke="#c2255c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="115" y="453">Graph</tspan><tspan x="115" y="471">Neo4j</tspan></text><path d="M420,120 L115,376" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="235" y="392">Full-text, ranking</tspan></text><rect x="230" y="425" width="190" height="65" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="325" y="453">Search engine</tspan><tspan x="325" y="471">Elasticsearch</tspan></text><path d="M420,120 L325,376" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="445" y="392">Aggregates over</tspan><tspan x="445" y="409">billions of rows</tspan></text><rect x="440" y="425" width="190" height="65" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="535" y="453">Columnar / OLAP</tspan><tspan x="535" y="471">ClickHouse, BigQuery</tspan></text><path d="M420,120 L535,376" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="655" y="392">Similarity of</tspan><tspan x="655" y="409">embeddings</tspan></text><rect x="650" y="425" width="190" height="65" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="745" y="453">Vector</tspan><tspan x="745" y="471">pgvector, Milvus</tspan></text><path d="M420,120 L745,376" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah0)"/></svg>