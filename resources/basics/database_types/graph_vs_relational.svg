<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Where graph databases win: multi-hop traversals</tspan></text><rect x="20" y="56" width="420" height="400" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="420" height="30" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="77" xml:space="preserve">Relational: one self-join per hop</tspan></text><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="34" y="110" xml:space="preserve">SELECT DISTINCT f3.friend_id</tspan><tspan x="34" y="127" xml:space="preserve">FROM friends f1</tspan><tspan x="34" y="144" xml:space="preserve">JOIN friends f2 ON f2.user_id = f1.friend_id</tspan><tspan x="34" y="161" xml:space="preserve">JOIN friends f3 ON f3.user_id = f2.friend_id</tspan><tspan x="34" y="178" xml:space="preserve">WHERE f1.user_id = :me;</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="215" xml:space="preserve">Rows touched per hop  (avg 200 friends, log scale)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="247" xml:space="preserve">hop 1</tspan></text><rect x="90" y="232" width="69.03089986991944" height="22" rx="4" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="163.03089986991944" y="247" xml:space="preserve">200</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="281" xml:space="preserve">hop 2</tspan></text><rect x="90" y="266" width="138.06179973983888" height="22" rx="4" fill="#a5d8ff" stroke="#1971c2" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="232.06179973983888" y="281" xml:space="preserve">40,000</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="315" xml:space="preserve">hop 3</tspan></text><rect x="90" y="300" width="207.0926996097583" height="22" rx="4" fill="#ffc9c9" stroke="#e03131" stroke-width="1"/><text font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#1e1e1e" font-weight="normal"><tspan x="301.0926996097583" y="315" xml:space="preserve">8,000,000</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="34" y="350" xml:space="preserve">Each hop is an index lookup / join, and the</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="34" y="367" xml:space="preserve">intermediate result grows ~ d^k.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="34" y="390" xml:space="preserve">Fine for 1–2 hops. Gets painful at 4+ hops,</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="34" y="407" xml:space="preserve">variable depth ('shortest path between A, B'),</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="34" y="424" xml:space="preserve">or pattern matching.</tspan></text><rect x="460" y="56" width="420" height="400" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="460" y="56" width="420" height="30" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" font-weight="bold"><tspan x="474" y="77" xml:space="preserve">Graph DB: follow pointers (index-free adjacency)</tspan></text><path d="M500,190 L600,130" fill="none" stroke="#e03131" stroke-width="3"/><path d="M500,190 L600,190" fill="none" stroke="#adb5bd" stroke-width="1.5"/><path d="M500,190 L600,250" fill="none" stroke="#adb5bd" stroke-width="1.5"/><path d="M600,130 L700,110" fill="none" stroke="#adb5bd" stroke-width="1.5"/><path d="M600,130 L700,150" fill="none" stroke="#e03131" stroke-width="3"/><path d="M600,190 L700,190" fill="none" stroke="#adb5bd" stroke-width="1.5"/><path d="M600,190 L700,230" fill="none" stroke="#adb5bd" stroke-width="1.5"/><path d="M600,250 L700,270" fill="none" stroke="#adb5bd" stroke-width="1.5"/><path d="M600,250 L700,310" fill="none" stroke="#adb5bd" stroke-width="1.5"/><path d="M700,150 L810,130" fill="none" stroke="#e03131" stroke-width="3"/><path d="M700,270 L810,250" fill="none" stroke="#adb5bd" stroke-width="1.5"/><circle cx="500" cy="190" r="16" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="500" y="194" xml:space="preserve">me</tspan></text><circle cx="600" cy="130" r="13" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><circle cx="600" cy="190" r="13" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><circle cx="600" cy="250" r="13" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><circle cx="700" cy="110" r="13" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><circle cx="700" cy="150" r="13" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><circle cx="700" cy="190" r="13" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><circle cx="700" cy="230" r="13" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><circle cx="700" cy="270" r="13" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><circle cx="700" cy="310" r="13" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><circle cx="810" cy="130" r="13" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><circle cx="810" cy="250" r="13" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="474" y="345" xml:space="preserve">Each node stores direct pointers to neighbours:</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="474" y="362" xml:space="preserve">hop cost doesn't depend on total graph size, only on</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="474" y="379" xml:space="preserve">the part you actually visit.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="474" y="402" xml:space="preserve">Query languages: Cypher, Gremlin, SPARQL.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="474" y="419" xml:space="preserve">Great for: paths, rings/cycles, variable-depth patterns.</tspan></text><rect x="20" y="474" width="860" height="70" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="496" xml:space="preserve">Reality check for interviews</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="515" xml:space="preserve">At web scale most companies model the social graph as adjacency lists in sharded SQL or KV stores (e.g. Meta's TAO: a graph API on sharded MySQL + cache),</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="34" y="531" xml:space="preserve">because friend lookups are 1-hop. Reach for a graph DB only when queries are genuinely deep/variable-depth and the data fits one cluster.</tspan></text></svg>