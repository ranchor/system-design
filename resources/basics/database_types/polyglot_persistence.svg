<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Polyglot persistence: one source of truth, many derived stores</tspan></text><rect x="20" y="190" width="170" height="90" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="105.0" y="222.375" xml:space="preserve">Source of truth</tspan><tspan x="105.0" y="239.375" xml:space="preserve">Postgres / MySQL</tspan><tspan x="105.0" y="256.375" xml:space="preserve">(transactions, invariants)</tspan></text><rect x="235" y="190" width="140" height="90" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="305.0" y="222.375" xml:space="preserve">WAL / binlog</tspan><tspan x="305.0" y="239.375" xml:space="preserve">→ CDC</tspan><tspan x="305.0" y="256.375" xml:space="preserve">(Debezium)</tspan></text><rect x="420" y="190" width="130" height="90" rx="10" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="485.0" y="230.875" xml:space="preserve">Kafka</tspan><tspan x="485.0" y="247.875" xml:space="preserve">(change events)</tspan></text><path d="M190,235 L235,235" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M375,235 L420,235" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="48" width="240" height="56" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="760.0" y="72.2" xml:space="preserve">Elasticsearch</tspan><tspan x="760.0" y="88.2" xml:space="preserve">full-text search, facets</tspan></text><path d="M550,235 L640,76" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="128" width="240" height="56" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="760.0" y="152.2" xml:space="preserve">Redis</tspan><tspan x="760.0" y="168.2" xml:space="preserve">cache / hot reads</tspan></text><path d="M550,235 L640,156" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="208" width="240" height="56" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="760.0" y="232.2" xml:space="preserve">Warehouse / OLAP</tspan><tspan x="760.0" y="248.2" xml:space="preserve">ClickHouse, BigQuery</tspan></text><path d="M550,235 L640,236" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="288" width="240" height="56" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="760.0" y="312.2" xml:space="preserve">Vector index</tspan><tspan x="760.0" y="328.2" xml:space="preserve">semantic search</tspan></text><path d="M550,235 L640,316" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="372" xml:space="preserve">Why not just write to all of them from the app (dual write)?</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="20" y="394" xml:space="preserve">If one write succeeds and the other fails, stores silently diverge. There is no atomic commit across Postgres and Elasticsearch.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="422" xml:space="preserve">Do instead:</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="20" y="440" xml:space="preserve">•  Write only to the source of truth; derive everything else from its log (CDC) or an outbox table written in the same transaction.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="20" y="458" xml:space="preserve">•  Consumers are idempotent and replayable; derived stores can be rebuilt from the log.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#495057" font-weight="normal"><tspan x="20" y="476" xml:space="preserve">•  Accept staleness on derived stores (search shows a new product seconds later); read-your-writes goes to the source of truth.</tspan></text></svg>