1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="585.0" y="269.875" width="190.00000000000003" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="680" y="284">write(token=34)  accepted</tspan></text><path d="M70,340 L790,340" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ah2)"/><rect x="302.24" y="329.875" width="255.52" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="430" y="344">write(token=33)  REJECTED: 33 &lt; 34</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#495057"><tspan x="40" y="413">storage keeps max token seen and rejects older ones,</tspan><tspan x="40" y="431">so a paused ex-holder cannot corrupt data</tspan></text></svg>