<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">MapReduce / Spark: map → shuffle → reduce (the shuffle is the expensive part)</tspan></text><rect x="20" y="70" width="120" height="44" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="80.0" y="95.675" xml:space="preserve">Input split 1</tspan></text><rect x="190" y="70" width="100" height="44" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="240.0" y="95.675" xml:space="preserve">Map 1</tspan></text><path d="M142,92 L188,92" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="150" width="120" height="44" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="80.0" y="175.675" xml:space="preserve">Input split 2</tspan></text><rect x="190" y="150" width="100" height="44" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="240.0" y="175.675" xml:space="preserve">Map 2</tspan></text><path d="M142,172 L188,172" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="20" y="230" width="120" height="44" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="80.0" y="255.675" xml:space="preserve">Input split 3</tspan></text><rect x="190" y="230" width="100" height="44" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="240.0" y="255.675" xml:space="preserve">Map 3</tspan></text><path d="M142,252 L188,252" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="340" y="56" width="220" height="250" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="450" y="80" xml:space="preserve">SHUFFLE</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal" text-anchor="middle"><tspan x="450" y="106" xml:space="preserve">partition by key,</tspan><tspan x="450" y="121" xml:space="preserve">sort, move across network,</tspan><tspan x="450" y="136" xml:space="preserve">spill to disk</tspan></text><path d="M292,92 L338,150" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M292,172 L338,190" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M292,252 L338,230" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="610" y="110" width="110" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="665.0" y="135.675" xml:space="preserve">Reduce 1</tspan></text><path d="M562,130 L608,132" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="610" y="200" width="110" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="665.0" y="225.675" xml:space="preserve">Reduce 2</tspan></text><path d="M562,180 L608,222" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="770" y="150" width="140" height="44" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="840.0" y="175.675" xml:space="preserve">Output (HDFS / S3)</tspan></text><path d="M722,132 L768,165" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M722,222 L768,185" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="20" y="330" xml:space="preserve">Word count: map emits (word,1); shuffle groups by word; reduce sums. Combiner = local pre-aggregation to cut shuffle size.</tspan></text></svg>