<svg xmlns="http://www.w3.org/2000/svg" width="844" height="434" viewBox="0 0 844 434"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1e1e1e"/></marker><marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#e03131"/></marker><marker id="as1" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#e03131"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">Circuit breaker state machine</tspan></text><ellipse cx="125.0" cy="190.0" rx="85.0" ry="40.0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="125" y="177">CLOSED</tspan><tspan x="125" y="195">calls pass,</tspan><tspan x="125" y="212">count failures</tspan></text><ellipse cx="445.0" cy="190.0" rx="85.0" ry="40.0" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="445" y="177">OPEN</tspan><tspan x="445" y="195">fail fast /</tspan><tspan x="445" y="212">fallback</tspan></text><ellipse cx="285.0" cy="370.0" rx="85.0" ry="40.0" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="285" y="357">HALF-OPEN</tspan><tspan x="285" y="375">allow a few</tspan><tspan x="285" y="392">trial calls</tspan></text><path d="M210,175 L360,175" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="200.35999999999999" y="165.5" width="169.28000000000003" height="19.0" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#343a40" text-anchor="middle"><tspan x="285" y="179">failure rate &gt; threshold</tspan></text><path d="M445,230 L340,335" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="331.38" y="273.0" width="122.24000000000001" height="19.0" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#343a40" text-anchor="middle"><tspan x="392" y="286">cool-down elapsed</tspan></text><path d="M250,335 L125,230" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="136.45999999999998" y="273.0" width="102.08000000000001" height="19.0" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#343a40" text-anchor="middle"><tspan x="188" y="286">trials succeed</tspan></text><path d="M320,330 L400,230" fill="none" stroke="#e03131" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><rect x="319.04" y="270.5" width="81.92" height="19.0" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#343a40" text-anchor="middle"><tspan x="360" y="284">trial fails</tspan></text><rect x="600" y="150" width="220" height="130" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#1e1e1e" text-anchor="middle"><tspan x="710" y="185">Combine with:</tspan><tspan x="710" y="202">- timeout per call</tspan><tspan x="710" y="220">- retry + backoff + jitter</tspan><tspan x="710" y="237">- bulkhead pool</tspan><tspan x="710" y="255">- fallback (cache)</tspan></text></svg>