<svg xmlns="http://www.w3.org/2000/svg" width="824" height="484" viewBox="0 0 824 484"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#adb5bd"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#adb5bd"/></marker><marker id="ah1" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="as1" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">TCP vs UDP</tspan></text><rect x="20" y="60" width="380" height="400" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2" font-weight="bold"><tspan x="30" y="80">TCP: handshake, ACKs, ordered</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="55" y="109">Client</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="300" y="109">Server</tspan></text><path d="M80,120 L80,440" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)"/><path d="M325,120 L325,440" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)"/><path d="M80,145 L325,145" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="187.57999999999998" y="134.875" width="29.840000000000003" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="202" y="149">SYN</tspan></text><path d="M325,185 L80,185" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><rect x="173.01999999999998" y="174.875" width="58.96000000000001" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="202" y="189">SYN-ACK</tspan></text><path d="M80,225 L325,225" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="187.57999999999998" y="214.875" width="29.840000000000003" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="202" y="229">ACK</tspan></text><path d="M80,275 L325,275" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="162.1" y="264.875" width="80.80000000000001" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="202" y="279">data seq=1</tspan></text><path d="M325,315 L80,315" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><rect x="180.3" y="304.875" width="44.400000000000006" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="202" y="319">ACK 2</tspan></text><path d="M80,355 L325,355" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="96.57999999999998" y="344.875" width="211.84000000000003" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="202" y="359">data seq=2  (lost -&gt; resent)</tspan></text><path d="M325,400 L80,400" fill="none" stroke="#1e1e1e" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah1)"/><rect x="180.3" y="389.875" width="44.400000000000006" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="202" y="404">ACK 3</tspan></text><rect x="420" y="60" width="380" height="400" rx="12" fill="#fff4e6" stroke="#e8590c" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#e8590c" font-weight="bold"><tspan x="430" y="80">UDP: just send datagrams</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="455" y="109">Client</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" font-weight="bold"><tspan x="700" y="109">Server</tspan></text><path d="M480,120 L480,440" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)"/><path d="M725,120 L725,440" fill="none" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah0)"/><path d="M480,150 L725,150" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="562.1" y="139.875" width="80.80000000000001" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="602" y="154">datagram 1</tspan></text><path d="M480,195 L725,195" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="562.1" y="184.875" width="80.80000000000001" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x="602" y="199">datagram 2</tspan></text><path d="M480,240 L725,240" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah1)"/><rect x="562.1" y="229.875" width="80.80000000000001" height="20.25" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#343a40" text-anchor="middle"><tspan x=