<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Geohash (prefix grid) vs quadtree (adaptive subdivision)</tspan></text><rect x="20" y="56" width="440" height="310" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="440" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">Geohash: fixed grid, string prefix = area</tspan></text><rect x="40" y="100" width="70" height="50" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="110" y="100" width="70" height="50" rx="0" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="180" y="100" width="70" height="50" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="250" y="100" width="70" height="50" rx="0" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="40" y="150" width="70" height="50" rx="0" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="110" y="150" width="70" height="50" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="180" y="150" width="70" height="50" rx="0" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="250" y="150" width="70" height="50" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="40" y="200" width="70" height="50" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="110" y="200" width="70" height="50" rx="0" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="180" y="200" width="70" height="50" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="250" y="200" width="70" height="50" rx="0" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="40" y="250" width="70" height="50" rx="0" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="110" y="250" width="70" height="50" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="180" y="250" width="70" height="50" rx="0" fill="#e9ecef" stroke="#868e96" stroke-width="1"/><rect x="250" y="250" width="70" height="50" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="110" y="150" width="70" height="50" rx="0" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="145" y="180" xml:space="preserve">9q8y</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="330" y="120" xml:space="preserve">longer prefix =</tspan><tspan x="330" y="135" xml:space="preserve">smaller cell</tspan><tspan x="330" y="150" xml:space="preserve">9q8 → 9q8y → 9q8yy</tspan><tspan x="330" y="165" xml:space="preserve"></tspan><tspan x="330" y="180" xml:space="preserve">Neighbors: query the</tspan><tspan x="330" y="195" xml:space="preserve">cell + its 8 neighbors</tspan><tspan x="330" y="210" xml:space="preserve">(edge cases at borders)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="40" y="320" xml:space="preserve">Pros: simple, works in any key-value/SQL index (prefix scan)</tspan><tspan x="40" y="335" xml:space="preserve">Cons: uniform cells waste space in sparse areas; border problem</tspan></text><rect x="480" y="56" width="440" height="310" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="480" y="56" width="440" height="28" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="492" y="76" xml:space="preserve">Quadtree: split a cell when it holds &gt; K points</tspan></text><rect x="500" y="100" width="200" height="200" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><rect x="500" y="100" width="100" height="100" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="600" y="100" width="100" height="100" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="500" y="200" width="100" height="100" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="600" y="200" width="100" height="100" rx="0" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="600" y="200" width="50" height="50" rx="0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1"/><rect x="650" y="200" width="50" height="50" rx="0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1"/><rect x="600" y="250" width="50" height="50" rx="0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1"/><rect x="650" y="250" width="50" height="50" rx="0" fill="#b2f2bb" stroke="#2f9e44" stroke-width="1"/><rect x="650" y="250" width="25" height="25" rx="0" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/><rect x="675" y="250" width="25" height="25" rx="0" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/><rect x="650" y="275" width="25" height="25" rx="0" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/><rect x="675" y="275" width="25" height="25" rx="0" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="720" y="120" xml:space="preserve">Dense downtown →</tspan><tspan x="720" y="135" xml:space="preserve">deep, small cells</tspan><tspan x="720" y="150" xml:space="preserve"></tspan><tspan x="720" y="165" xml:space="preserve">Empty ocean →</tspan><tspan x="720" y="180" xml:space="preserve">one big cell</tspan><tspan x="720" y="195" xml:space="preserve"></tspan><tspan x="720" y="210" xml:space="preserve">In memory tree on a</tspan><tspan x="720" y="225" xml:space="preserve">service; rebuild or</tspan><tspan x="720" y="240" xml:space="preserve">update incrementally</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="500" y="320" xml:space="preserve">Pros: adaptive to density; efficient k-nearest search</tspan><tspan x="500" y="335" xml:space="preserve">Cons: in-memory structure, harder to shard/persist than a prefix key</tspan></text></svg>