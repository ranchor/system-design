<svg xmlns="http://www.w3.org/2000/svg" width="864" height="394" viewBox="0 0 864 394"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">Same need, three API styles</tspan></text><rect x="20" y="60" width="260" height="310" rx="12" fill="#e7f5ff" stroke="#1971c2" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1971c2" font-weight="bold"><tspan x="30" y="80">REST: many resources</tspan></text><rect x="40" y="100" width="90" height="50" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="85" y="130">Client</tspan></text><path d="M130,115 L150,200" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="150" y="180" width="120" height="40" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="210" y="204">GET /users/1</tspan></text><path d="M130,129 L150,255" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="150" y="235" width="120" height="40" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="210" y="259">GET /users/1/posts</tspan></text><path d="M130,143 L150,310" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="150" y="290" width="120" height="40" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="210" y="314">GET /posts/9/likes</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="40" y="357">3 round trips, cacheable</tspan></text><rect x="300" y="60" width="260" height="310" rx="12" fill="#fff0f6" stroke="#c2255c" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c2255c" font-weight="bold"><tspan x="310" y="80">GraphQL: one query</tspan></text><rect x="320" y="100" width="90" height="50" rx="10" fill="#e9ecef" stroke="#495057" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="365" y="130">Client</tspan></text><rect x="320" y="180" width="220" height="95" rx="10" fill="#eebefa" stroke="#c2255c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" text-anchor="middle"><tspan x="430" y="216">POST /graphql</tspan><tspan x="430" y="231">{ user(id:1) { name</tspan><tspan x="430" y="246">  posts { title likes } } }</tspan></text><path d="M365,150 L365,180" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="320" y="312">1 round trip, exact fields;</tspan><tspan x="320" y="329">resolvers fan out server-side</tspan></text><rect x="580" y="60" width="260" height="310" rx="12" fill="#ebfbee" stroke="#2f9e44" stroke-width="1.2" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#2f9e44" font-weight="bold"><tspan x="590" y="80">gRPC: typed RPC</tspan></text><rect x="600" y="100" width="100" height="50" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="650" y="130">Service A</tspan></text><rect x="720" y="230" width="100" height="50" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#1e1e1e" text-anchor="middle"><tspan x="770" y="260">Service B</tspan></text><path d="M650,150 L770,230" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="648.88" y="173.0" width="122.24000000000001" height="34.0" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#343a40" text-anchor="middle"><tspan x="710" y="186">HTTP/2 + Protobuf</tspan><tspan x="710" y="201">GetUser(UserReq)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#495057"><tspan x="600" y="312">binary, streaming, deadlines;</tspan><tspan x="600" y="329">ideal service-to-service</tspan></text></svg>