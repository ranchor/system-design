<svg xmlns="http://www.w3.org/2000/svg" width="940" height="360" viewBox="0 0 940 360"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Transactional outbox: no dual write between DB and broker</tspan></text><rect x="20" y="140" width="120" height="44" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="80.0" y="165.85" xml:space="preserve">Service</tspan></text><rect x="190" y="90" width="270" height="150" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#1e1e1e" font-weight="bold"><tspan x="202" y="112" xml:space="preserve">One DB transaction</tspan></text><rect x="206" y="126" width="110" height="34" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="261.0" y="146.675" xml:space="preserve">orders row</tspan></text><rect x="334" y="126" width="110" height="34" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="389.0" y="146.675" xml:space="preserve">outbox row</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="204" y="190" xml:space="preserve">BEGIN; INSERT order; INSERT outbox; COMMIT;</tspan><tspan x="204" y="206" xml:space="preserve">both or neither</tspan></text><path d="M142,162 L188,162" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="500" y="126" width="130" height="44" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="565.0" y="144.675" xml:space="preserve">Relay / CDC</tspan><tspan x="565.0" y="158.675" xml:space="preserve">poll or tail WAL</tspan></text><path d="M462,150 L498,150" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="680" y="126" width="110" height="44" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="735.0" y="144.675" xml:space="preserve">Broker</tspan><tspan x="735.0" y="158.675" xml:space="preserve">Kafka / SQS</tspan></text><path d="M632,150 L678,150" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="820" y="126" width="100" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="870.0" y="144.675" xml:space="preserve">Consumer</tspan><tspan x="870.0" y="158.675" xml:space="preserve">(idempotent)</tspan></text><path d="M792,150 L818,150" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#495057" font-weight="normal"><tspan x="20" y="270" xml:space="preserve">Relay is at-least-once → consumers must dedupe (inbox table / idempotency key).</tspan><tspan x="20" y="288" xml:space="preserve">Retries with backoff; poison messages go to a DLQ; keep per-aggregate ordering by key.</tspan></text></svg>