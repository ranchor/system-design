<svg xmlns="http://www.w3.org/2000/svg" width="940" height="380" viewBox="0 0 940 380"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Event sourcing + CQRS: write events, build read models</tspan></text><rect x="20" y="150" width="100" height="44" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="70.0" y="168.35" xml:space="preserve">Command</tspan><tspan x="70.0" y="183.35" xml:space="preserve">PlaceOrder</tspan></text><rect x="170" y="150" width="150" height="44" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="245.0" y="168.675" xml:space="preserve">Aggregate</tspan><tspan x="245.0" y="182.675" xml:space="preserve">validate → emit events</tspan></text><rect x="370" y="150" width="170" height="44" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="455.0" y="168.675" xml:space="preserve">Event store (append-only)</tspan><tspan x="455.0" y="182.675" xml:space="preserve">OrderPlaced, ItemAdded…</tspan></text><path d="M122,172 L168,172" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M322,172 L368,172" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="620" y="80" width="290" height="44" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="765.0" y="105.675" xml:space="preserve">Projection → SQL read model</tspan></text><path d="M542,172 L618,102" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="620" y="150" width="290" height="44" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="765.0" y="175.675" xml:space="preserve">Projection → Search index</tspan></text><path d="M542,172 L618,172" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="620" y="220" width="290" height="44" rx="8" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="765.0" y="245.675" xml:space="preserve">Projection → Cache / dashboard</tspan></text><path d="M542,172 L618,242" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="620" y="300" width="290" height="40" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="765.0" y="323.675" xml:space="preserve">Query side reads these (eventual consistency)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="250" xml:space="preserve">State = fold(events). Replay to rebuild any view, audit, or time-travel.</tspan><tspan x="20" y="267" xml:space="preserve">Snapshots every N events speed up loading an aggregate.</tspan><tspan x="20" y="284" xml:space="preserve">CDC does the same for existing CRUD tables: DB log → Kafka → consumers.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="20" y="330" xml:space="preserve">Costs: eventual consistency of read models, event schema evolution, complexity.</tspan></text></svg>