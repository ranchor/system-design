<svg xmlns="http://www.w3.org/2000/svg" width="940" height="430" viewBox="0 0 940 430"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Fan-out on write (push) vs fan-out on read (pull)</tspan></text><rect x="20" y="56" width="440" height="310" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="56" width="440" height="28" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="76" xml:space="preserve">Fan-out on WRITE (push)</tspan></text><rect x="480" y="56" width="440" height="310" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="480" y="56" width="440" height="28" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="492" y="76" xml:space="preserve">Fan-out on READ (pull)</tspan></text><rect x="40" y="110" width="100" height="40" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="90.0" y="133.675" xml:space="preserve">Author posts</tspan></text><rect x="180" y="110" width="110" height="40" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="235.0" y="133.675" xml:space="preserve">Fan-out workers</tspan></text><rect x="330" y="100" width="100" height="30" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="380.0" y="118.5" xml:space="preserve">feed cache u1</tspan></text><rect x="330" y="138" width="100" height="30" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="380.0" y="156.5" xml:space="preserve">feed cache u2</tspan></text><rect x="330" y="176" width="100" height="30" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="380.0" y="194.5" xml:space="preserve">feed cache u3</tspan></text><path d="M142,130 L178,130" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M292,125 L328,115" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M292,135 L328,153" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M292,140 L328,191" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="40" y="230" xml:space="preserve">Write: O(followers) work, once per post</tspan><tspan x="40" y="246" xml:space="preserve">Read: O(1), one cache lookup</tspan><tspan x="40" y="262" xml:space="preserve">Good: most users, read-heavy</tspan><tspan x="40" y="278" xml:space="preserve">Bad: celebrities (10M writes per post),</tspan><tspan x="40" y="294" xml:space="preserve">wasted work for inactive followers</tspan></text><rect x="500" y="110" width="100" height="40" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="550.0" y="133.5" xml:space="preserve">Reader opens feed</tspan></text><rect x="640" y="106" width="130" height="48" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="705.0" y="126.5" xml:space="preserve">Query followees,</tspan><tspan x="705.0" y="140.5" xml:space="preserve">merge + rank</tspan></text><rect x="800" y="100" width="100" height="30" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="850.0" y="118.5" xml:space="preserve">posts of f1</tspan></text><rect x="800" y="138" width="100" height="30" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="850.0" y="156.5" xml:space="preserve">posts of f2</tspan></text><rect x="800" y="176" width="100" height="30" rx="8" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="850.0" y="194.5" xml:space="preserve">posts of f3</tspan></text><path d="M602,130 L638,130" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M762,125 L798,115" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M762,135 L798,153" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M762,140 L798,191" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="500" y="230" xml:space="preserve">Write: O(1) per post</tspan><tspan x="500" y="246" xml:space="preserve">Read: O(followees) fan-in + merge + rank</tspan><tspan x="500" y="262" xml:space="preserve">Good: celebrities, rarely active users</tspan><tspan x="500" y="278" xml:space="preserve">Bad: slow reads, heavy DB load on peak</tspan></text><rect x="20" y="388" width="0" height="0" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11.5" fill="#1e1e1e" font-weight="bold"><tspan x="180" y="412" xml:space="preserve">Hybrid (Twitter/Instagram): push for normal authors, pull and merge for celebrities.</tspan></text></svg>