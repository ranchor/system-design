<svg xmlns="http://www.w3.org/2000/svg" width="899" height="353" viewBox="0 0 899 353"><defs><marker id="ah0" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1e1e1e"/></marker><marker id="as0" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1e1e1e"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="37">Turning faults into non-events</tspan></text><rect x="20" y="90" width="195" height="90" rx="10" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="118" y="130">Redundancy</tspan><tspan x="118" y="149">replicas, N+1, multi-AZ</tspan></text><path d="M215,135 L240,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="240" y="90" width="195" height="90" rx="10" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="338" y="130">Isolation</tspan><tspan x="338" y="149">bulkheads, cells</tspan></text><path d="M435,135 L460,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="460" y="90" width="195" height="90" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="558" y="121">Detection</tspan><tspan x="558" y="140">heartbeats, checksums,</tspan><tspan x="558" y="159">SLO alerts</tspan></text><path d="M655,135 L680,135" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="680" y="90" width="195" height="90" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="778" y="121">Recovery</tspan><tspan x="778" y="140">failover, retry+backoff,</tspan><tspan x="778" y="159">replay log</tspan></text><rect x="20" y="230" width="300" height="60" rx="10" fill="#ffc9c9" stroke="#e03131" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="170" y="256">Fault: disk dies, node crashes,</tspan><tspan x="170" y="274">bad deploy, partition</tspan></text><path d="M320,260 L470,260" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#ah0)"/><rect x="347.88" y="249.25" width="94.24000000000001" height="21.5" fill="#ffffff" opacity="0.92"/><text font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#343a40" text-anchor="middle"><tspan x="395" y="265">absorbed by</tspan></text><rect x="470" y="230" width="300" height="60" rx="10" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#1e1e1e" text-anchor="middle"><tspan x="620" y="256">No failure: users still get</tspan><tspan x="620" y="274">correct answers</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#495057"><tspan x="20" y="324">Verify continuously: chaos testing, game days, restore drills, canary deploys</tspan></text></svg>