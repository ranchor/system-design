<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#868e96"/></marker><marker id="as" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#868e96"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text font-family="Helvetica, Arial, sans-serif" font-size="22" fill="#1e1e1e" font-weight="bold"><tspan x="20" y="36" xml:space="preserve">Aurora DSQL: disaggregated components, OCC at commit, active-active regions</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#495057" font-weight="normal"><tspan x="20" y="62" xml:space="preserve">One region (three AZs). Every component scales independently.</tspan></text><rect x="20" y="76" width="130" height="52" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="85.0" y="91.675" xml:space="preserve">Client</tspan><tspan x="85.0" y="105.675" xml:space="preserve">(Postgres protocol,</tspan><tspan x="85.0" y="119.675" xml:space="preserve">IAM auth)</tspan></text><rect x="180" y="76" width="130" height="52" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="245.0" y="98.675" xml:space="preserve">Frontend</tspan><tspan x="245.0" y="112.675" xml:space="preserve">session &amp; txn router</tspan></text><rect x="340" y="76" width="190" height="52" rx="8" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="435.0" y="91.5" xml:space="preserve">Query Processor (QP)</tspan><tspan x="435.0" y="105.5" xml:space="preserve">Postgres engine per connection</tspan><tspan x="435.0" y="119.5" xml:space="preserve">in a Firecracker microVM</tspan></text><path d="M150,102 L180,102" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M310,102 L340,102" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="340" y="146" xml:space="preserve">reads at snapshot T,</tspan><tspan x="340" y="159" xml:space="preserve">buffers writes locally</tspan></text><rect x="560" y="76" width="150" height="52" rx="8" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="635.0" y="91.675" xml:space="preserve">Adjudicators</tspan><tspan x="635.0" y="105.675" xml:space="preserve">own key ranges</tspan><tspan x="635.0" y="119.675" xml:space="preserve">(OCC conflict check)</tspan></text><rect x="740" y="76" width="140" height="52" rx="8" fill="#ffd8a8" stroke="#e8590c" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="810.0" y="91.675" xml:space="preserve">Journal</tspan><tspan x="810.0" y="105.675" xml:space="preserve">durable, ordered</tspan><tspan x="810.0" y="119.675" xml:space="preserve">log (multi-AZ)</tspan></text><path d="M530,96 L560,96" fill="none" stroke="#e03131" stroke-width="2" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#e03131" font-weight="normal" text-anchor="middle"><tspan x="545" y="72" xml:space="preserve">commit</tspan></text><path d="M710,102 L740,102" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><rect x="740" y="190" width="140" height="48" rx="8" fill="#d0bfff" stroke="#6741d9" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="810.0" y="203.675" xml:space="preserve">Crossbar</tspan><tspan x="810.0" y="217.675" xml:space="preserve">orders journals,</tspan><tspan x="810.0" y="231.675" xml:space="preserve">feeds storage</tspan></text><rect x="560" y="190" width="150" height="48" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="635.0" y="210.675" xml:space="preserve">Storage nodes</tspan><tspan x="635.0" y="224.675" xml:space="preserve">serve reads at time T</tspan></text><path d="M810,128 L810,190" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M740,214 L710,214" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)"/><path d="M580,190 L500,130" fill="none" stroke="#2f9e44" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ah)"/><text font-family="Helvetica, Arial, sans-serif" font-size="9" fill="#2f9e44" font-weight="normal"><tspan x="528" y="170" xml:space="preserve">reads</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="200" xml:space="preserve">Storage is NOT the source of truth: the journal is.</tspan><tspan x="20" y="215" xml:space="preserve">Storage can be rebuilt by replaying journals.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="20" y="238" xml:space="preserve">No leader, no writer instance, no locks held while a transaction runs.</tspan></text><rect x="20" y="262" width="520" height="250" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="20" y="262" width="520" height="28" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="32" y="282" xml:space="preserve">Life of a read-write transaction (snapshot isolation + OCC)</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal"><tspan x="34" y="312" xml:space="preserve">1  BEGIN → QP gets a start timestamp T from the time service.</tspan><tspan x="34" y="332" xml:space="preserve">2  Reads come from storage as of T (consistent snapshot, no locks).</tspan><tspan x="34" y="352" xml:space="preserve">3  Writes are buffered in the QP; nothing is visible to others.</tspan><tspan x="34" y="372" xml:space="preserve">4  COMMIT → QP sends write set (and read info) to adjudicators.</tspan><tspan x="34" y="392" xml:space="preserve">5  Adjudicator checks: did anyone commit a conflicting write to</tspan><tspan x="34" y="412" xml:space="preserve">   these keys after T?   yes → ABORT (client retries)   no → pick commit time.</tspan><tspan x="34" y="432" xml:space="preserve">6  Commit record is appended to the journal (durable, replicated).</tspan><tspan x="34" y="452" xml:space="preserve">7  Acknowledge the client; crossbar updates storage asynchronously.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#2f9e44" font-weight="bold"><tspan x="34" y="494" xml:space="preserve">Read-only transactions: no adjudication, no journal write, no cross-region hop.</tspan></text><rect x="560" y="262" width="320" height="250" rx="10" fill="#ffffff" stroke="#adb5bd" stroke-width="1"/><rect x="560" y="262" width="320" height="28" rx="10" fill="#c3fae8" stroke="#0c8599" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="572" y="282" xml:space="preserve">Multi-region (active-active)</tspan></text><rect x="574" y="304" width="130" height="50" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="639.0" y="325.35" xml:space="preserve">Region A</tspan><tspan x="639.0" y="340.35" xml:space="preserve">reads + writes</tspan></text><rect x="736" y="304" width="130" height="50" rx="8" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#1e1e1e" font-weight="bold" text-anchor="middle"><tspan x="801.0" y="325.35" xml:space="preserve">Region B</tspan><tspan x="801.0" y="340.35" xml:space="preserve">reads + writes</tspan></text><rect x="655" y="392" width="130" height="44" rx="8" fill="#e9ecef" stroke="#868e96" stroke-width="2"/><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#1e1e1e" font-weight="normal" text-anchor="middle"><tspan x="720.0" y="410.675" xml:space="preserve">Witness region</tspan><tspan x="720.0" y="424.675" xml:space="preserve">journal only</tspan></text><path d="M704,329 L736,329" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)" marker-start="url(#as)"/><path d="M620,354 L690,392" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)" marker-start="url(#as)"/><path d="M800,354 L750,392" fill="none" stroke="#adb5bd" stroke-width="2" marker-end="url(#ah)" marker-start="url(#as)"/><text font-family="Helvetica, Arial, sans-serif" font-size="10" fill="#495057" font-weight="normal"><tspan x="572" y="458" xml:space="preserve">Commit = synchronous journal replication to a</tspan><tspan x="572" y="472" xml:space="preserve">majority of {A, B, witness}. One region + witness</tspan><tspan x="572" y="486" xml:space="preserve">still commits if the other fails.</tspan></text><rect x="20" y="530" width="860" height="116" rx="10" fill="#e9ecef" stroke="#868e96" stroke-width="1" stroke-dasharray="6 4"/><text font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#1e1e1e" font-weight="bold"><tspan x="34" y="554" xml:space="preserve">Consequences to say out loud in an interview</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="34" y="574" xml:space="preserve">• Hot rows are the enemy: concurrent updates to the same row abort at commit. Retry with jittered backoff; spread counters; keep transactions short.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="34" y="592" xml:space="preserve">• Isolation is snapshot (≈ Postgres Repeatable Read); write skew is possible, so use SELECT … FOR UPDATE or write a shared row to force conflict.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="34" y="610" xml:space="preserve">• Postgres-compatible subset: at launch no foreign keys / views / temp tables, per-transaction row limits; check current docs before committing to it.</tspan></text><text font-family="Helvetica, Arial, sans-serif" font-size="10.5" fill="#495057" font-weight="normal"><tspan x="34" y="628" xml:space="preserve">• Compared with DynamoDB: SQL, joins and multi-row ACID at any scale, but OCC retries and a smaller feature set; DynamoDB wins on raw per-key throughput and maturity.</tspan></text></svg>